version: 2

updates:
  # The core and the CLI have no runtime dependencies on purpose, so this
  # mostly covers the web app and the TypeScript toolchain.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for routine patches rather than five, so real
      # security bumps stay visible instead of drowning in noise.
      routine:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: ['dependencies']

  # The three tools CI installs from lockfiles of their own (#874): a pin
  # nothing raises is a pin that goes stale. An entry and a group of their own,
  # not the root's: in one group with the root, GitHub refused the whole
  # pull request and the root's updates with it (#881). And at the root's
  # tools/, not under .github/: there GitHub refused their pull request even
  # on its own (#886).
  - package-ecosystem: npm
    directories:
      - /tools/acorn
      - /tools/bundle-analyzer
      - /tools/playwright-core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      ci-tools:
        patterns: ['*']
    labels: ['dependencies', 'ci']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # `init` and `analyze` are two entry points of one action and must move
      # together: analyze refuses a configuration file init wrote at another
      # version. Raised one at a time they are each red on their own, which
      # security.test.js holds on purpose; raised together they are one green
      # pull request.
      codeql:
        patterns: ['github/codeql-action*']
    labels: ['dependencies', 'ci']

  # The Dockerfile's base image is pinned by digest (#874). Dependabot raises
  # the digest, and the tag beside it, when Docker Hub moves.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['dependencies']
