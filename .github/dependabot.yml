version: 2

updates:
  # The core and the CLI have no runtime dependencies on purpose, so this
  # mostly covers the web app and the TypeScript toolchain.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for routine patches rather than five, so real
      # security bumps stay visible instead of drowning in noise.
      routine:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # `init` and `analyze` are two entry points of one action and must move
      # together: analyze refuses a configuration file init wrote at another
      # version. Raised one at a time they are each red on their own, which
      # security.test.js holds on purpose; raised together they are one green
      # pull request.
      codeql:
        patterns: ['github/codeql-action*']
    labels: ['dependencies', 'ci']
