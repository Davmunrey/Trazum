# Blank issues stay on. A template that does not fit is a reason to write
# freely, not a reason to give up — and the reports nobody anticipated are
# usually the interesting ones.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/Davmunrey/Trazum/security/advisories/new
    about: >
      Do not open a public issue. Report privately through a security advisory —
      SECURITY.md states what is in scope and what to expect.
  - name: Question, or an idea you are not sure about
    url: https://github.com/Davmunrey/Trazum/discussions
    about: >
      Discussions, not issues. An issue is a thing to do; a question is a thing to
      answer, and mixing them makes the issue list stop meaning anything.
  - name: What is planned, and what was deliberately not planned
    url: https://github.com/Davmunrey/Trazum/blob/main/ROADMAP.md
    about: >
      Every entry carries the reasoning, including the ones under "Under
      consideration" that were considered and left out.
