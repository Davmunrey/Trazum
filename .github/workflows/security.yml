name: Security

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after a quiet period still surfaces
    # instead of waiting for someone to open a pull request.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: it diffs the manifest against the base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Copyleft licences would change the terms of a repository that
          # promises MIT. Flagged for a human, not silently accepted.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # High and critical fail the build. Lower severities are reported but do
      # not block: a moderate advisory in a build-only dependency should not
      # stop a documentation fix from merging.
      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Report all advisories
        if: always()
        run: npm audit || true
