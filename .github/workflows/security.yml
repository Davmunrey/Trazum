name: Security

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after a quiet period still surfaces
    # instead of waiting for someone to open a pull request.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3

  # Dormant until Dependency graph is switched on in repository settings.
  #
  # Without that setting the action does not report "no findings" — it errors
  # out with "not supported on this repository", and no pull request can enable
  # it for itself. The two honest states are a check that is permanently red,
  # which teaches people to ignore red, or one that is permanently green while
  # doing nothing, which is worse. So it is skipped instead, visibly, until
  # someone opts in:
  #
  #   Settings -> Security -> enable Dependency graph
  #   Settings -> Secrets and variables -> Actions -> Variables ->
  #     DEPENDENCY_REVIEW = enabled
  #
  # From then on it gates for real, with no continue-on-error softening it.
  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: it diffs the manifest against the base.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          # Copyleft licences would change the terms of a repository that
          # promises MIT. Flagged for a human, not silently accepted.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # What people install is @trazum/core and @trazum/cli, and both carry
      # zero dependencies — so this gate is what keeps that true. Any advisory
      # at all here is a real finding and blocks.
      - name: Audit the published packages
        run: |
          npm audit --audit-level=low --workspace @trazum/core --workspace @trazum/cli

      # apps/web is `private: true` — a deployed application, not something
      # anyone installs. Its advisories are reported in full and reviewed, but
      # they do not block: the current ones are build-time-only and unreachable
      # (see SECURITY.md), and their fix is a major Next upgrade that should be
      # its own change rather than something smuggled into an unrelated PR.
      - name: Report application advisories
        if: always()
        run: npm audit || true

  # ------------------------------------------------------------------------
  # The gap the other jobs leave.
  #
  # CodeQL's pull-request check reports *new alerts in the code that pull
  # request changed*. A finding already open on `main` is not new, so every
  # later pull request goes green beside it — which is exactly what happened
  # here: eleven consecutive green runs while a critical SSRF alert sat open.
  #
  # Green on a pull request is not green on the repository, and nobody should
  # have to remember to open the Code scanning page to learn the difference.
  # ------------------------------------------------------------------------
  open-alerts:
    name: No open alerts on main
    runs-on: ubuntu-latest
    # Only on main and on the weekly run. On a pull request this would report
    # the base branch's state, failing somebody's unrelated work for a finding
    # they did not introduce and cannot fix from their branch.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      # Read-only: the job reports, it never resolves or dismisses anything.
      security-events: read
    steps:
      - name: Fail if main carries an open high-severity alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `severity` is the query's own rating; `security_severity_level` is
          # the CVSS-style one that "Critical" in the UI comes from. Reading
          # only the first would have let today's critical through as "error".
          alerts=$(gh api \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" \
            --jq '[.[] | select((.rule.security_severity_level // "") == "critical"
                             or (.rule.security_severity_level // "") == "high")]')

          count=$(echo "$alerts" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No open critical or high alerts on main."
            exit 0
          fi

          echo "::error::main has $count open high-severity code-scanning alert(s)."
          echo "$alerts" | jq -r '.[] | "  #\(.number) \(.rule.security_severity_level | ascii_upcase)  \(.rule.id)\n      \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"'
          echo
          echo "Fix them, or dismiss with a reason at:"
          echo "  https://github.com/${GITHUB_REPOSITORY}/security/code-scanning?query=is%3Aopen"
          exit 1
