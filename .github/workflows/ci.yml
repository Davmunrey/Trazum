name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

# Least privilege by default. Any job needing more must ask for it explicitly,
# which makes the request visible in review.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, because one guard reads it. The action pin the
          # README tells people to copy is checked against the *commit it names*
          # — the label has to be true about that SHA, not about the working
          # tree — and with the default `fetch-depth: 1` that object is absent,
          # so the check would skip on every run and report success for having
          # verified nothing.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile, and `--ignore-scripts` stops a
      # dependency's install hook from running arbitrary code in CI. Build
      # scripts we control are invoked explicitly below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build core, CLI and MCP server
        run: npm run build

      # Named for what it runs. `npm test` at the root covers core, CLI, web and
      # the Action, and has for a while — a step labelled "Core and CLI tests"
      # invites somebody reading a green build to think the other two are
      # unchecked, or somebody adding a suite to think they need a new step.
      - name: Tests (core, CLI, MCP, web, Action)
        run: npm test

      # This repository takes its own gate. `trazum.config.json` and
      # `trazum.baseline.json` are committed, so a pull request that grows the
      # prompts past the recorded figure fails here — the same way it would in
      # somebody else's repository, run by the binary this build just made.
      #
      # The whole tree, scoped by the config's `ignore`. Before that field
      # existed this walk read seventy-four documents and half a million tokens
      # of README and changelog as "prompts", plus thirty-five test fixtures,
      # which is why no baseline was ever committed here. See
      # docs/our-own-medicine.md.
      - name: Our own baseline gate
        run: node packages/cli/dist/index.js check .

      - name: Typecheck the web app
        run: npm run typecheck -w @trazum/web

      - name: Build the web app
        run: npm run build:web

  action-selftest:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Both sample prompts, so the action is exercised against each
        # language's dictionary rather than only one.
        sample: ['examples/sample-prompt.en.txt', 'examples/sample-prompt.es.txt']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: The action passes with a generous budget
        uses: ./
        with:
          target: ${{ matrix.sample }}
          max-tokens: 5000

      - name: The action fails with an impossible budget
        id: over-budget
        uses: ./
        continue-on-error: true
        with:
          target: ${{ matrix.sample }}
          max-tokens: 10

      - name: Verify the failure was detected
        if: steps.over-budget.outcome != 'failure'
        run: |
          echo "The action should have failed with max-tokens=10"
          exit 1

      # A failing run has to leave a report behind, which is the whole point of
      # the reporting steps carrying `if: always()`. Checked by reading the file
      # the action writes, since $GITHUB_STEP_SUMMARY is not readable back.
      # Placed here on purpose: a later passing run overwrites the same path.
      - name: A failing run still writes a report
        run: |
          report="$RUNNER_TEMP/trazum-report.md"
          if [ ! -s "$report" ]; then
            echo "No report was written by the failing run"
            exit 1
          fi
          echo "--- report from the failing run ---"
          cat "$report"
          grep -q 'over budget' "$report" || { echo "missing the verdict"; exit 1; }

      # The deprecated input still works. Renaming it would otherwise break every
      # workflow already using this action, which is not a thing to discover from
      # someone else's red build.
      - name: The deprecated 'file' input still works
        uses: ./
        with:
          file: ${{ matrix.sample }}
          max-tokens: 5000

  action-directory-mode:
    name: GitHub Action directory mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Built in the workspace, because that is what the action's target is
      # relative to. A config budget has to be reachable through the action with
      # no max-tokens at all, and the config's own `level` has to survive:
      # passing `--level safe` unconditionally is what made it dead in 0.10.0.
      - name: Build a small repository of prompts
        run: |
          mkdir -p fixture/prompts
          cp examples/sample-prompt.en.txt fixture/prompts/big.txt
          printf 'Classify the ticket.\n' > fixture/prompts/small.txt
          printf 'Loose note, deliberately outside every pattern.\n' > fixture/loose.txt
          cat > fixture/generous.json <<'JSON'
          { "level": "aggressive", "budgets": { "fixture/prompts/**": 5000 } }
          JSON
          cat > fixture/tight.json <<'JSON'
          { "budgets": { "fixture/prompts/**": 10 } }
          JSON

      - name: A directory passes on config budgets alone, with no max-tokens
        uses: ./
        with:
          target: fixture/prompts
          config: fixture/generous.json

      - name: A busted config budget fails the build
        id: tight
        uses: ./
        continue-on-error: true
        with:
          target: fixture/prompts
          config: fixture/tight.json

      - name: Verify the tight budget failed
        if: steps.tight.outcome != 'failure'
        run: |
          echo "The action should have failed against a 10-token budget"
          exit 1

      # An unbudgeted prompt has to appear in the report rather than be skipped
      # quietly, and a failing run has to leave a report at all.
      - name: The report names the failure and the unbudgeted file
        run: |
          report="$RUNNER_TEMP/trazum-report.md"
          if [ ! -s "$report" ]; then
            echo "No report was written by the failing run"
            exit 1
          fi
          echo "--- report ---"
          cat "$report"
          grep -q 'over budget' "$report" || { echo "missing the verdict"; exit 1; }

      - name: A run over the whole fixture lists the unbudgeted file
        uses: ./
        with:
          target: fixture
          config: fixture/generous.json

      - name: Verify the unbudgeted note is present
        run: |
          report="$RUNNER_TEMP/trazum-report.md"
          cat "$report"
          grep -q 'loose.txt' "$report" || { echo "the loose prompt is missing"; exit 1; }
          grep -q 'not covered by any budget' "$report" || {
            echo "an unbudgeted prompt was not called out"; exit 1; }

  action-spend-gate:
    name: GitHub Action spend gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Exact arithmetic, so the verdicts below are hand-checkable: one call of
      # a million input tokens on Claude Opus 5 is $5.00.
      - name: Write two usage logs, one cheap and one dear
        run: |
          mkdir -p fixture
          printf '%s\n' \
            '{"model":"claude-opus-5","label":"chat","usage":{"input_tokens":1000000,"output_tokens":0}}' \
            > fixture/cheap.jsonl
          printf '%s\n' \
            '{"model":"claude-opus-5","label":"chat","usage":{"input_tokens":1000000,"output_tokens":0}}' \
            '{"model":"claude-opus-5","label":"chat","usage":{"input_tokens":1000000,"output_tokens":0}}' \
            '{"model":"claude-opus-5","label":"chat","usage":{"input_tokens":1000000,"output_tokens":0}}' \
            > fixture/dear.jsonl

      - name: A log under its budget passes
        uses: ./
        with:
          usage-log: fixture/cheap.jsonl
          max-usd: '9'

      - name: A log over its budget fails the build
        id: over
        uses: ./
        continue-on-error: true
        with:
          usage-log: fixture/dear.jsonl
          max-usd: '9'

      - name: Verify the spend gate failed
        if: steps.over.outcome != 'failure'
        run: |
          echo "The action should have failed a \$15.00 log against a \$9 budget"
          exit 1

      - name: Growth past the limit fails the build too
        id: growth
        uses: ./
        continue-on-error: true
        with:
          usage-log: fixture/dear.jsonl
          against: fixture/cheap.jsonl
          max-growth-usd: '5'

      - name: Verify the growth gate failed
        if: steps.growth.outcome != 'failure'
        run: |
          echo "The action should have failed +\$10.00 growth against a \$5 limit"
          exit 1

      - name: The failing run still leaves a report
        run: |
          report="$RUNNER_TEMP/trazum-report.md"
          if [ ! -s "$report" ]; then
            echo "No report was written by the failing run"
            exit 1
          fi
          cat "$report"

      - name: Naming both modes at once is refused
        id: both
        uses: ./
        continue-on-error: true
        with:
          target: fixture
          usage-log: fixture/cheap.jsonl

      - name: Verify the two-mode run was refused
        if: steps.both.outcome != 'failure'
        run: |
          echo "target and usage-log together should be an error"
          exit 1

      # The drill-downs compose with the gates. Same hand arithmetic: chat is
      # one $5.00 call on day 1, batch is two more on day 2 — $15.00 in all.
      - name: Write a labelled, dated usage log
        run: |
          printf '%s\n' \
            '{"model":"claude-opus-5","label":"chat","ts":"2026-08-01T10:00:00Z","usage":{"input_tokens":1000000,"output_tokens":0}}' \
            '{"model":"claude-opus-5","label":"batch","ts":"2026-08-02T10:00:00Z","usage":{"input_tokens":1000000,"output_tokens":0}}' \
            '{"model":"claude-opus-5","label":"batch","ts":"2026-08-02T11:00:00Z","usage":{"input_tokens":1000000,"output_tokens":0}}' \
            > fixture/mixed.jsonl

      - name: One workload's budget passes where the whole log would fail
        uses: ./
        with:
          usage-log: fixture/mixed.jsonl
          label: chat
          max-usd: '9'

      - name: One day's budget passes where the whole log would fail
        uses: ./
        with:
          usage-log: fixture/mixed.jsonl
          until: '2026-08-01'
          max-usd: '9'

      - name: The same budget over the dear day fails
        id: dearday
        uses: ./
        continue-on-error: true
        with:
          usage-log: fixture/mixed.jsonl
          since: '2026-08-02'
          max-usd: '9'

      - name: Verify the windowed gate failed
        if: steps.dearday.outcome != 'failure'
        run: |
          echo "The action should have failed \$10.00 of day 2 against a \$9 budget"
          exit 1

      # The cache gate, on its own hand arithmetic: a million 5-minute write
      # tokens nothing reads back cost $6.25 against $5.00 as plain input —
      # a +$1.25 loss, exactly.
      - name: Write a log whose cache only writes
        run: |
          printf '%s\n' \
            '{"model":"claude-opus-5","usage":{"input_tokens":0,"output_tokens":0,"cache_creation_input_tokens":1000000,"cache_creation":{"ephemeral_5m_input_tokens":1000000,"ephemeral_1h_input_tokens":0}}}' \
            > fixture/writes-only.jsonl

      - name: A cache loss under its budget passes
        uses: ./
        with:
          usage-log: fixture/writes-only.jsonl
          max-cache-loss-usd: '1.50'

      - name: A cache loss over its budget fails the build
        id: cacheloss
        uses: ./
        continue-on-error: true
        with:
          usage-log: fixture/writes-only.jsonl
          max-cache-loss-usd: '1'

      - name: Verify the cache gate failed
        if: steps.cacheloss.outcome != 'failure'
        run: |
          echo "The action should have failed a \$1.25 cache loss against a \$1 limit"
          exit 1

      - name: A window the log does not cover is an error, not a passing $0 gate
        id: emptywindow
        uses: ./
        continue-on-error: true
        with:
          usage-log: fixture/mixed.jsonl
          since: '2026-09-01'
          max-usd: '9'

      - name: Verify the empty window was refused
        if: steps.emptywindow.outcome != 'failure'
        run: |
          echo "A window matching nothing should be an error naming the log's span"
          exit 1
