name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar librería y CLI
        run: npm run build

      - name: Tests del núcleo
        run: npm test

      - name: Typecheck de la web
        run: npm run typecheck -w @trazum/web

      - name: Compilar la web
        run: npm run build:web

  action-selftest:
    name: Self-test de la GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: La acción pasa con presupuesto holgado
        uses: ./
        with:
          file: examples/prompt-ejemplo.txt
          max-tokens: 5000

      - name: La acción falla con presupuesto imposible
        id: over-budget
        uses: ./
        continue-on-error: true
        with:
          file: examples/prompt-ejemplo.txt
          max-tokens: 10

      - name: Verificar que el fallo se detectó
        if: steps.over-budget.outcome != 'failure'
        run: |
          echo "La acción debería haber fallado con max-tokens=10"
          exit 1
