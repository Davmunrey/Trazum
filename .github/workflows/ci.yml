name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar librería y CLI
        run: npm run build

      - name: Tests del núcleo
        run: npm test

      - name: Typecheck de la web
        run: npm run typecheck -w @trazum/web

      - name: Compilar la web
        run: npm run build:web
