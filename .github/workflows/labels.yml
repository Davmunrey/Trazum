name: Labels

# .github/labels.json is the list of labels and what each one means. This makes
# GitHub's list match it: every label in the file is created, or its colour and
# description corrected. A label that is only on GitHub is left alone, because
# deleting it would strip it from every issue that carries it; remove it by hand
# once nothing uses it. issue-intake.test.js holds the file to the issue forms,
# dependabot.yml and CONTRIBUTING.md.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/labels.json
          sparse-checkout-cone-mode: false

      - name: Create or correct every label in .github/labels.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node -e '
            const labels = JSON.parse(require("fs").readFileSync(".github/labels.json", "utf8"));
            for (const l of labels) console.log([l.name, l.color, l.description].join("\t"));
          ' | while IFS=$'\t' read -r name color description; do
            gh label create "$name" --color "$color" --description "$description" --force
            echo "synced: $name"
          done
