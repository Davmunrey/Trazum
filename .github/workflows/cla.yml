name: CLA

# The one workflow allowed to use pull_request_target, and the guard in
# security.test.js pins why that is safe here: no step checks out anybody's
# code, so the writable token never shares a runner with anything a
# contributor controls. The event is needed at all because a fork's
# pull_request token is read-only — a CLA bot on the plain event could not
# comment on exactly the pull requests it exists for.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA gate
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/Davmunrey/Trazum/blob/main/docs/cla/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'Davmunrey,dependabot[bot],github-actions[bot],*[bot]'
