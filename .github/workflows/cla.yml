name: CLA

# The one workflow allowed to use pull_request_target, and the guard in
# security.test.js pins why that is safe here: no step checks out anybody's
# code, so the writable token never shares a runner with anything a
# contributor controls. The event is needed at all because a fork's
# pull_request token is read-only — a CLA bot on the plain event could not
# comment on exactly the pull requests it exists for.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA gate
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/Davmunrey/Trazum/blob/main/docs/cla/CLA.md'
          branch: 'cla-signatures'
          # This repository's own agent, listed under both spellings the
          # action can resolve it to. It picks
          # `commit.author.user || commit.committer.user || commit.author`
          # and compares `login || name` against each pattern **exactly**,
          # case included. Today the agent's commit email belongs to the
          # GitHub account `claude`, so the lowercase login is what arrives
          # — reading the source alone suggested the capitalised commit
          # name and that was wrong, which cost two red pull requests.
          # `Claude` stays beside it because it is what the same resolver
          # falls back to if that email is ever unlinked. The CLA exists
          # for external contributors, not for the maintainer's tools.
          allowlist: 'Davmunrey,claude,Claude,dependabot[bot],github-actions[bot],*[bot]'
          # Chosen, not inherited: the action defaults this to true, which
          # locks the conversation on every merged pull request. A merged
          # PR is still where somebody asks why a change was made.
          lock-pullrequest-aftermerge: false
