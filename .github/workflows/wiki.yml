name: Wiki

# Publishes wiki/ to the repository's GitHub wiki on every merge to main, and
# once a week says whether the published wiki still matches it.
#
# wiki/ is generated by scripts/build-wiki.mjs from documents this repository
# keeps, and wiki.test.js holds it to them. What was missing was the last step:
# the wiki is a second git repository (<repo>.wiki.git), the build script
# prints two commands for the owner to run and holds no credential, and so the
# published pages were only as current as the last time somebody remembered.
# scripts/publish-wiki.mjs decides what to write and also holds no credential
# and makes no network call; this file is the only place that clones, commits
# and pushes, and the only place the token is used.
#
# NOT TESTED FROM WHERE IT WAS WRITTEN. The session that wrote this workflow
# could not reach the wiki's repository, so the clone, the push and the way the
# token reaches git here have never run. The script and this file's shape are
# held by wiki-publish.test.js. The first run of the publish job on main is the
# first real one: read its log before trusting the wiki again.
#
# The wiki has to exist first. GitHub creates the wiki's repository when the
# first page is saved in the web UI, and until then it cannot be cloned. The
# owner saves one page there, once (the page is overwritten by this workflow),
# and the publish job fails with a sentence saying so until it is done.
#
# It has no pull request trigger, neither the plain event nor the one that
# carries a writable token (security.test.js bans that one by name, which is
# why it is not spelled out here). A job that can write to the wiki must not run
# code a pull request supplied, and nothing here needs to: the workflow runs the
# scripts as they are on main.

on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - scripts/publish-wiki.mjs
      - .github/workflows/wiki.yml
  schedule:
    # Mondays at 10:13. The minute is not shared with any other workflow
    # (04:17, 06:41, 07:23, 07:53, 08:47 and 09:31 are taken), and it comes
    # after them, so a stale repository's failures do not arrive in one email.
    - cron: '13 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One at a time, in order, and a run in progress finishes: cancelling a publish
# half way could leave the wiki without the push, and the run that follows is
# the one that should bring it up to date, not the one that stops the first.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish wiki/ to the wiki
    # Only a push to main publishes. A manual run, from any branch, and the
    # weekly run both go to the compare job and never write.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GitHub's wiki is pushed with the repository's own token, and that needs
      # write on contents: there is no separate permission for the wiki. It
      # widens what this job's token can do from reading the repository to
      # pushing to it and to its wiki. What limits it: the job runs on main
      # only, after review, and runs code that is on main (never a pull
      # request's); the checkout keeps no credential in the working tree; the
      # token reaches git through the environment of two steps and is neither
      # in a URL nor on a command line; and the one script that runs makes no
      # network call. SECURITY.md says the same.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/build-wiki.mjs
            scripts/publish-wiki.mjs
            README.md
            ROADMAP.md
            /wiki/
          sparse-checkout-cone-mode: false

      # The token is given to git as an Authorization header set for this one
      # command through GIT_CONFIG_* variables, so it is not in the remote's URL,
      # not in .git/config of the clone and not in the arguments of any process.
      # The header is the token encoded, so the encoded form is masked as well.
      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_URL: https://github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="Authorization: basic $credential"
          if ! git clone --quiet "$WIKI_URL" "$RUNNER_TEMP/wiki"; then
            echo "::error::The wiki could not be cloned. If git said the repository was not found, the wiki has no page yet: the owner has to save one page in the web UI first (the Wiki tab, then Create the first page), once, and this workflow overwrites it. If the Wiki feature is switched off in the repository settings, switch it on."
            exit 1
          fi

      - name: Copy the pages that differ
        run: node scripts/publish-wiki.mjs --into "$RUNNER_TEMP/wiki"

      - name: Commit and push, if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wiki"
          if [ -z "$(git status --porcelain)" ]; then
            echo "The wiki already matches wiki/ at $SOURCE_SHA: nothing to commit, nothing pushed."
            exit 0
          fi
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m "Rebuild the wiki from main at $SOURCE_SHA"
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="Authorization: basic $credential"
          git push --quiet origin HEAD
          echo "Pushed the wiki, built from main at $SOURCE_SHA."

  compare:
    name: The published wiki matches wiki/
    # Never on a push. A manual run from a branch other than main compares that
    # branch's pages and still cannot publish: only the job above writes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/build-wiki.mjs
            scripts/publish-wiki.mjs
            README.md
            ROADMAP.md
            /wiki/
          sparse-checkout-cone-mode: false

      - name: Clone the wiki, read only
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_URL: https://github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="Authorization: basic $credential"
          if ! git clone --quiet "$WIKI_URL" "$RUNNER_TEMP/wiki"; then
            echo "::error::The wiki could not be cloned. If git said the repository was not found, the wiki has no page yet: the owner has to save one page in the web UI first (the Wiki tab, then Create the first page), once. If the Wiki feature is switched off in the repository settings, switch it on."
            exit 1
          fi

      # A failure on the weekly run lands on main, where GitHub tells the owner.
      # It means a page was edited in GitHub's editor, or a merge was never
      # published. Neither is fixed here: this job writes nothing.
      - name: Compare the pages
        run: node scripts/publish-wiki.mjs --check --into "$RUNNER_TEMP/wiki"
