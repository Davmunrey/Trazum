name: Coverage

# Which lines the tests run, measured by scripts/coverage.mjs and sent to
# Codecov. docs/coverage.md says what the figure is and what it is not.
#
# It is its own workflow, and not a required check, on purpose. The required
# job is the judge of whether the tests pass. This one measures: the same
# tests again, more slowly, with a counter on every line. A second verdict
# from it would be noise, and an outage at somebody else's service must never
# be what stands between a pull request and `main`. So a test that fails here
# does not fail this job, and an upload that fails on a pull request leaves a
# warning and does not fail it either. On `main` a failed upload does: that is
# where the record is kept, and nobody's merge is waiting on it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older measurement useless.
concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Line coverage, reported
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The uploader, pinned, with the checksum its publisher lists for this
      # version. It is fetched below and refused if the two do not agree: the
      # same arrangement as the guide script in pr-guide.yml. Nothing in any
      # package depends on it.
      CODECOV_CLI_VERSION: v11.3.2
      CODECOV_CLI_SHA256: 8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973
      # Codacy's reporter, pinned the same way. The checksum is the SHA-512 its
      # publisher lists beside the release of this version on GitHub, which is
      # the one its own install script compares against.
      CODACY_REPORTER_VERSION: 14.1.3
      CODACY_REPORTER_SHA512: 73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history: two of the core's tests read it, and Codecov
          # compares a pull request with the commit it branched from.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The report is mapped back to the TypeScript through the build's source
      # maps, so there is nothing to measure before this.
      - name: Build
        run: npm run build

      - name: Run the tests with coverage
        run: npm run coverage

      - name: Fetch the uploader and check it is the one that was pinned
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/codecov" "https://cli.codecov.io/${CODECOV_CLI_VERSION}/linux/codecov"
          echo "${CODECOV_CLI_SHA256}  $RUNNER_TEMP/codecov" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/codecov"

      # One upload for each package, flagged with its name, so Codecov can say
      # what the core's own tests cover apart from what the CLI's reach in it.
      #
      # The token is a repository secret and reaches the uploader through the
      # environment, where it reads it by name; it is never on a command line.
      # It has to be a repository secret: this job names no environment, so an
      # environment's secrets are not given to it. A pull request from a fork
      # has no secret at all, and Codecov takes an upload without a token from
      # a fork and from nowhere else: the first run of this, from a branch of
      # this repository with no token, was refused (#706).
      #
      # The uploader is always asked to fail on an error, so that its exit
      # code means something. What a failure does is decided here: on `main`
      # it fails the job, and on a pull request it leaves a warning.
      - name: Upload the reports to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          # Said out loud, because the two cases look the same from outside
          # until an upload to `main` is refused. Its value is never printed.
          if [ -n "$CODECOV_TOKEN" ]; then echo "An upload token is set."; else echo "No upload token here. Codecov takes an upload without one only from a fork's pull request."; fi
          refused=0
          for report in coverage/*.lcov; do
            flag="$(basename "$report" .lcov)"
            "$RUNNER_TEMP/codecov" upload-process --disable-search --fail-on-error -F "$flag" -f "$report" || refused=1
          done
          # The same run's test results, for Codecov's test analytics: each
          # test's name, how long it took and, when it failed, why. That is
          # what tells a test that fails now and then from one that fails,
          # which the core has one of (#712). Same uploader, same token, same
          # rule for a refusal.
          for results in coverage/*.junit.xml; do
            flag="$(basename "$results" .junit.xml)"
            "$RUNNER_TEMP/codecov" upload-process --disable-search --fail-on-error --report-type test_results -F "$flag" -f "$results" || refused=1
          done
          if [ "$refused" = "1" ] && [ "$EVENT" = "push" ]; then
            echo "::error::Codecov did not take an upload from main. The log above says why."
            exit 1
          fi
          if [ "$refused" = "1" ]; then
            echo "::warning::Codecov did not take the upload, so nothing is recorded there for this pull request. The figures measured above stand."
          fi

      # A second reader of the same reports. Codecov is where the record is
      # kept; Codacy shows the figure beside what it finds in the code, and
      # nothing here waits on it. So this step cannot fail the job because of
      # Codacy: no token, a download that fails and an upload Codacy refuses
      # each leave a line in the log and stop there. One thing does fail it,
      # and should: a reporter whose checksum is not the one pinned above is
      # not run, and the job says so.
      #
      # The reporter is fetched only when there is a token to use it with, so
      # a fork's pull request, which has none, fetches nothing. Its install
      # script is not used: that fetches whatever is latest at run time.
      #
      # The token is a repository secret, read by the reporter from the
      # environment by name and never on a command line. Like Codecov's, it
      # has to be a repository secret: this job names no environment.
      - name: Send the same reports to Codacy, where there is a token for it
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          # A pull request is measured at a merge commit GitHub makes for the
          # run, which Codacy has never seen. It is told the commit that was
          # pushed.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "No Codacy token here, so nothing is sent to Codacy."
            exit 0
          fi
          echo "A Codacy token is set."
          reporter="$RUNNER_TEMP/codacy-coverage-reporter"
          if ! curl -fsSL --retry 3 -o "$reporter" "https://artifacts.codacy.com/bin/codacy-coverage-reporter/${CODACY_REPORTER_VERSION}/codacy-coverage-reporter-linux"; then
            echo "::warning::Codacy's reporter could not be fetched, so nothing is sent to Codacy from this run. The figures measured above stand."
            exit 0
          fi
          echo "${CODACY_REPORTER_SHA512}  $reporter" | sha512sum --check --strict -
          chmod +x "$reporter"
          reports=()
          for report in coverage/*.lcov; do
            reports+=(-r "$report")
          done
          if ! "$reporter" report --commit-uuid "$COMMIT" --force-coverage-parser lcov "${reports[@]}"; then
            echo "::warning::Codacy did not take the coverage, so nothing is recorded there for this commit. The figures measured above stand, and Codecov's record is not affected."
          fi
