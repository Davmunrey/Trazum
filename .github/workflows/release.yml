name: Release

# Publishing is the one action in this repository that cannot be undone. npm
# allows unpublishing for 72 hours and then the version number is spent for
# good, so everything below is arranged so that a mistake fails the job rather
# than reaching the registry.
#
# Two ways in, one decision. A release PR — the one that folds the changelog
# and bumps the manifests — is the decision, and merging it is the act: a push
# to main whose manifests name a version the registry does not have publishes,
# tags the merge commit, and creates the GitHub release, with no further human
# step. A pushed tag still works and is the manual override; every other push
# to main is skipped by the decide job in seconds.
on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  # Manual runs are dry-run only. A workflow_dispatch that could publish would
  # mean a release with no version decision behind it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time and never cancelled: two quick merges to main must
  # queue rather than race the registry, and cancelling a publish mid-flight
  # is how a half-released set of packages happens.
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # The fast gate in front of the environment. Every push to main lands here;
  # only one carrying an unpublished manifest version — a merged release PR —
  # goes on to the release job. Deliberately outside `environment: release`:
  # if a required reviewer is ever added to that environment, ordinary merges
  # must not queue behind it.
  decide:
    name: Anything to release?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.versions.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # The same preflight the release job runs before uploading, used here as
      # the routing decision. Dependency-free, so no install is needed. On a
      # half-published set it fails, which fails the run — the right red. On
      # workflow_dispatch it is skipped and the release job runs as a dry run.
      - name: No version may already be on the registry
        id: versions
        if: github.event_name == 'push'
        run: node scripts/npm-publish-preflight.mjs versions

  release:
    name: Publish to npm
    needs: decide
    # Tags and dry runs always proceed; a push to main proceeds only when the
    # manifests name a version the registry does not have.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Write, and only because `gh release create` needs it to attach a body to
      # the tag. Worth stating plainly since it is a widening: this job now has
      # the token to push to the repository, where before it could only read.
      #
      # Nothing here uses it for anything else. The checkout is
      # `persist-credentials: false`, so the git remote in the working tree has
      # no token to reuse, and the only step touching the API is the one that
      # creates the release from a file already in the commit.
      contents: write
      # What npm trusted publishing exchanges for a short-lived credential,
      # and what signs the provenance attestation either way. The design
      # prefers no stored credential at all; npm has refused the OIDC exchange
      # on six real publish attempts across three versions, so the publish
      # steps below also accept an environment-scoped secrets.NPM_TOKEN as
      # the authentication fallback — auth changes, the provenance signature
      # does not, because it comes from this OIDC identity rather than from
      # the upload credential. Remove the secret and the same steps revert to
      # pure OIDC. See docs/releasing.md.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 1.9.0 was tagged, passed every check, and failed on the last step with
      # `E404 Not Found - PUT` because the trusted publisher had not been
      # configured. Nothing was published — but the tag was spent, and the
      # release went out by hand for the second time running, which means no
      # provenance for the second time running.
      #
      # This asks npm the same question the upload steps below ask it, before
      # anything is at stake, and it runs on `workflow_dispatch` too. A dry run
      # proved the environment gate existed and nothing about npm, so the only
      # way to test a trusted publisher was to spend a version number on it.
      #
      # It reports and never fails: the exchange endpoint is npm's internal
      # plumbing rather than a documented API, and a gate built on it would one
      # day block a release that would have worked. The publish is still the
      # authority. See scripts/npm-publish-preflight.mjs.
      - name: Can this workflow authenticate to npm?
        run: node scripts/npm-publish-preflight.mjs auth

      # The tag says what is being released. The manifests say what would
      # actually be published. A tag reading v1.2.0 against manifests reading
      # 1.1.0 publishes 1.1.0 under a release note for 1.2.0, and that is the
      # one mistake there is no correcting after 72 hours.
      #
      # `publish.test.js` already asserts that every manifest carries the *same*
      # version. This checks that the shared version is the tagged one.
      - name: The tag and the manifests must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag says $tag, package.json says $manifest"
            exit 1
          fi
          echo "Releasing $manifest"

      # Everything CI runs, in the order CI runs it. Reused rather than
      # reimplemented: a release gate that checks less than the pull-request
      # gate is a gate that lets through exactly what the tag was for.
      - name: Verify
        run: npm run verify

      # `npm publish` runs prepublishOnly, which rebuilds — so what is inspected
      # here has to be built the same way. `pack --dry-run` reports the file list
      # without producing a tarball to clean up.
      - name: Show what would ship
        run: |
          npm pack --dry-run -w @trazum/core
          npm pack --dry-run -w @trazum/cli
          npm pack --dry-run -w @trazum/mcp

      # The packages publish in dependency order, so a half-finished release is
      # the expensive shape: core uploads, the CLI fails, and core's number is
      # spent — npm never reuses a version, so the whole set has to move to the
      # next patch. Checking all three first turns that into a clean abort.
      #
      # This one does fail the job. It reads the public registry API rather than
      # internal plumbing, and a version that already exists is not a maybe.
      #
      # It emits `publish`, which is false when *every* version is already there.
      # That is a finished release missing only its tag — 1.10.0 was exactly that
      # — and treating it as a collision would refuse the GitHub release for a
      # version that had shipped, then blame authentication for it.
      - name: No version may already be on the registry
        id: versions
        if: github.event_name == 'push'
        run: node scripts/npm-publish-preflight.mjs versions

      # Provenance comes free with OIDC and is the reason to prefer it beyond
      # not storing a secret: a consumer can verify a published tarball was built
      # from this repository, at this commit, by this workflow.
      - name: Publish @trazum/core
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # Empty when the secret is not set, which leaves OIDC trusted
          # publishing as the auth — the preferred path. When npm keeps
          # refusing the OIDC exchange (it has, on six real attempts), a
          # granular token stored as an environment secret on `release`
          # takes precedence and the publish succeeds anyway. Provenance
          # survives either way: the attestation is signed with the job's
          # OIDC identity, which is independent of how the upload
          # authenticates.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @trazum/core --provenance --access public

      # Second, and only if the first succeeded. @trazum/cli depends on
      # @trazum/core at an exact version, so publishing the CLI first would leave
      # a window where installing it fails on a dependency that does not exist.
      - name: Publish @trazum/cli
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # Same fallback as core's step, documented there.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @trazum/cli --provenance --access public

      # Third, for the same reason the CLI is second: @trazum/mcp pins
      # @trazum/core at an exact version too, so publishing it before core exists
      # leaves a window where installing it fails.
      - name: Publish @trazum/mcp
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # Same fallback as core's step, documented there.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @trazum/mcp --provenance --access public

      # npm reports a write you are not authorised for as `404 Not Found`, which
      # reads as a missing package and is an auth failure. That cost an hour at
      # the first publish and reappeared at 1.9.0, so the workflow says it out
      # loud rather than leaving it in a document somebody has to already know
      # to read.
      #
      # `failure()` rather than a specific step id: any publish failing here is
      # worth this note, and naming one step would go quiet the moment the
      # failure moved to the next package.
      - name: What that failure probably means
        if: failure()
        run: |
          echo "::error::A publish step failed. If the log says 'E404 Not Found - PUT', that is"
          echo "::error::an authentication failure, not a missing package — npm reports them the same way."
          echo "::error::Check the trusted publisher on each package: npm settings -> Publishing access"
          echo "::error::-> Trusted publisher, with Environment set to 'release'. It is the field people"
          echo "::error::leave blank, and this workflow declares 'environment: release', so a blank one"
          echo "::error::is a claims mismatch. Full procedure in docs/releasing.md."
          echo "::error::If the release environment carries the npm token secret, auth came from it"
          echo "::error::and this failure is something else - read the npm error above, not this note."
          echo "::error::Nothing is half-published: the preflight checks all versions before the first upload."
          node scripts/npm-publish-preflight.mjs claims

      # The release body comes from RELEASES.md, which was written and reviewed in
      # a pull request. Before this, publishing to npm created no GitHub release
      # at all: the tag existed and the page behind it was empty, so anyone
      # arriving from a "what changed?" link got a file list.
      #
      # `release-notes.mjs` exits non-zero when the version has no section, so a
      # release whose notes were never written fails here rather than shipping
      # with a blank page. `publish.test.js` refuses the same thing earlier, at
      # the point of commit; this is the backstop for a tag pushed by hand.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      # The same release when the trigger was the merge rather than a tag.
      # `gh release create --target` creates the tag itself, pointing at the
      # merged commit — and a tag created with GITHUB_TOKEN does not retrigger
      # this workflow, so there is no second run racing this one.
      - name: Publish the GitHub release and the tag (from main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$version" > /tmp/release-notes.md
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes-file /tmp/release-notes.md

      # Checked on manual runs, so a missing notes section is caught by the
      # dry run rather than discovered while releasing.
      - name: Dry run finished
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null
          echo "Dry run — nothing published. Release notes present."
