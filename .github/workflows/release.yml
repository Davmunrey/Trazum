name: Release

# Publishing is the one action in this repository that cannot be undone. npm
# allows unpublishing for 72 hours and then the version number is spent for
# good, so everything below is arranged so that a mistake fails the job rather
# than reaching the registry.
#
# Two ways in, one decision. A release PR — the one that folds the changelog
# and bumps the manifests — is the decision, and merging it is the act: a push
# to main whose manifests name a version the registry does not have publishes,
# tags the merge commit, and creates the GitHub release, with no further human
# step. A pushed tag still works and is the manual override; every other push
# to main is skipped by the decide job in seconds.
#
# Two channels. A release (`X.Y.Z`) publishes to npm's `latest`, which every
# `npm install` resolves. A next prerelease (`X.Y.Z-next.N`) is committed on a
# branch, tagged `vX.Y.Z-next.N`, and publishes to `next` only: the same gate,
# the same `verify`, every upload with `--tag next`, and none of what a
# release on `latest` adds (no GitHub release, no files, no MCP listing).
# `scripts/npm-channel.mjs` decides which, once, in `decide`; a prerelease on
# main and a tag that does not name the manifests' version are refused there.
# `npm-channel.test.js` holds every place below that reads the answer.
on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  # Manual runs are dry-run only. A workflow_dispatch that could publish would
  # mean a release with no version decision behind it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time and never cancelled: two quick merges to main must
  # queue rather than race the registry, and cancelling a publish mid-flight
  # is how a half-released set of packages happens.
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # The fast gate in front of the environment. Every push to main lands here;
  # only one carrying an unpublished manifest version — a merged release PR —
  # goes on to the release job. Deliberately outside `environment: release`:
  # if a required reviewer is ever added to that environment, ordinary merges
  # must not queue behind it.
  decide:
    name: Anything to release?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.versions.outputs.publish }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      # Which dist-tag this run publishes to, latest or next, on every run: the
      # uploads take it as `--tag`, so a run with no answer must not reach
      # them. It refuses a prerelease on main and a tag that does not name
      # the manifests' version, which fails this job and so the release.
      - name: Which npm channel?
        id: channel
        run: node scripts/npm-channel.mjs

      # The same preflight the release job runs before uploading, used here as
      # the routing decision. Dependency-free, so no install is needed. On a
      # half-published set it fails, which fails the run — the right red. On
      # workflow_dispatch it is skipped and the release job runs as a dry run.
      - name: No version may already be on the registry
        id: versions
        if: github.event_name == 'push'
        run: node scripts/npm-publish-preflight.mjs versions

  release:
    name: Publish to npm
    needs: decide
    # Tags and dry runs always proceed; a push to main proceeds only when the
    # manifests name a version the registry does not have. And only on one of
    # the two channels: an empty answer would be an upload with an empty --tag.
    if: (needs.decide.outputs.channel == 'latest' || needs.decide.outputs.channel == 'next') && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || needs.decide.outputs.publish == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Write, and only because `gh release create` needs it to attach a body to
      # the tag. Worth stating plainly since it is a widening: this job now has
      # the token to push to the repository, where before it could only read.
      #
      # Nothing here uses it for anything else. The checkout is
      # `persist-credentials: false`, so the git remote in the working tree has
      # no token to reuse, and the only step touching the API is the one that
      # creates the release from a file already in the commit.
      contents: write
      # What npm trusted publishing exchanges for a short-lived credential,
      # and what signs the provenance attestation either way. The design
      # prefers no stored credential at all, and this repository does not have
      # that: npm refused the OIDC exchange on six real publish attempts across
      # three versions, and it was still refusing all four packages on the
      # 1.86.0 run that published successfully. So the publish steps below also
      # accept an environment-scoped secrets.NPM_TOKEN, which is the credential
      # actually authenticating uploads today rather than a fallback in waiting.
      # Auth changes, the provenance signature does not, because it comes from
      # this OIDC identity rather than from the upload credential. Remove the
      # secret and the same steps revert to pure OIDC — and, on today's
      # evidence, stop publishing. See docs/releasing.md.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, as CI checks out, because `verify` below is
          # the same suite CI runs and two of its guards read the tags:
          # `changelog-coverage.test.js` measures "not yet released" against
          # the newest tag and refuses to guess when a clone has none. 2.4.0's
          # first run failed exactly there, on a shallow checkout, having
          # published nothing — the right red, and the wrong depth.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 1.9.0 was tagged, passed every check, and failed on the last step with
      # `E404 Not Found - PUT` because the trusted publisher had not been
      # configured. Nothing was published — but the tag was spent, and the
      # release went out by hand for the second time running, which means no
      # provenance for the second time running.
      #
      # This asks npm the same question the upload steps below ask it, before
      # anything is at stake, and it runs on `workflow_dispatch` too. A dry run
      # proved the environment gate existed and nothing about npm, so the only
      # way to test a trusted publisher was to spend a version number on it.
      #
      # It reports and never fails: the exchange endpoint is npm's internal
      # plumbing rather than a documented API, and a gate built on it would one
      # day block a release that would have worked. The publish is still the
      # authority. See scripts/npm-publish-preflight.mjs.
      - name: Can this workflow authenticate to npm?
        run: node scripts/npm-publish-preflight.mjs auth

      # The step above asks about the credential this workflow would prefer. It
      # answered "refused" at 1.86.0 and answers it still, and the uploads go
      # through on the token below. Nothing asked about the token, and it has
      # an expiry: 2.7.10's release pull request merged, this job ran five
      # minutes of checks, and the first upload answered `E404 Not Found - PUT`
      # with `main` already naming a version npm did not have.
      #
      # So npm is asked `whoami` with it here, before `verify`, and on
      # `workflow_dispatch` too: a dry run from a release pull request's branch
      # says whether the token is alive before it is merged. It reports and
      # does not fail: a trusted publisher npm accepted would need no token,
      # and an accepted token can still be refused the upload (EOTP, the same
      # afternoon). The script's header has both measurements. The token
      # reaches this one script, which has no dependency and sends it to npm's
      # registry or nowhere.
      - name: Is the stored npm token still alive?
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/npm-publish-preflight.mjs token

      # The tag says what is being released. The manifests say what would
      # actually be published. A tag reading v1.2.0 against manifests reading
      # 1.1.0 publishes 1.1.0 under a release note for 1.2.0, and that is the
      # one mistake there is no correcting after 72 hours.
      #
      # `publish.test.js` already asserts that every manifest carries the *same*
      # version. This checks that the shared version is the tagged one.
      - name: The tag and the manifests must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag says $tag, package.json says $manifest"
            exit 1
          fi
          echo "Releasing $manifest"

      # Everything CI runs, in the order CI runs it. Reused rather than
      # reimplemented: a release gate that checks less than the pull-request
      # gate is a gate that lets through exactly what the tag was for.
      - name: Verify
        run: npm run verify

      # `npm publish` runs prepublishOnly, which rebuilds — so what is inspected
      # here has to be built the same way. `pack --dry-run` reports the file list
      # without producing a tarball to clean up.
      - name: Show what would ship
        run: |
          npm pack --dry-run -w @trazum/core
          npm pack --dry-run -w @trazum/cli
          npm pack --dry-run -w @trazum/mcp
          npm pack --dry-run -w @trazum/tokenizer-openai

      - name: Stress the packed release in an isolated installation
        run: npm run verify:packages

      # The software bill of materials attached to the GitHub release (OWASP
      # ASVS 14.2.5): every workspace and every third-party package any of them
      # needs at run time, read from the lockfile, as CycloneDX. Made here, on
      # every run including the dry run and before anything is uploaded, so a
      # bill that fails its own check stops the release while nothing is
      # published. `test/sbom.test.mjs` makes and checks the same document on
      # every pull request.
      - name: Bill of materials
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/sbom.mjs "/tmp/sbom/trazum-v$version.cdx.json"

      # The packages publish in dependency order, so a half-finished release is
      # the expensive shape: core uploads, the CLI fails, and core's number is
      # spent — npm never reuses a version, so the whole set has to move to the
      # next patch. Checking all four first turns that into a clean abort.
      #
      # This one does fail the job. It reads the public registry API rather than
      # internal plumbing, and a version that already exists is not a maybe.
      #
      # It emits `publish`, which is false when *every* version is already there.
      # That is a finished release missing only its tag — 1.10.0 was exactly that
      # — and treating it as a collision would refuse the GitHub release for a
      # version that had shipped, then blame authentication for it.
      - name: No version may already be on the registry
        id: versions
        if: github.event_name == 'push'
        run: node scripts/npm-publish-preflight.mjs versions

      # Provenance comes free with OIDC and is the reason to prefer it beyond
      # not storing a secret: a consumer can verify a published tarball was built
      # from this repository, at this commit, by this workflow.
      - name: Publish @trazum/core
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # Empty when the secret is not set, which would leave OIDC trusted
          # publishing as the auth — the preferred path, and not the path this
          # repository is on. The `auth` step above reported all four packages
          # rejected on the 1.86.0 run and all four published seconds later, so
          # this granular token, stored as an environment secret on `release`,
          # is what authenticates every upload today. Deleting it stops
          # releases. Provenance survives either way: the attestation is signed
          # with the job's OIDC identity, which is independent of how the
          # upload authenticates. Evidence in docs/releasing.md, step 3.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # latest or next, from decide. Without --tag, npm moves latest to
          # whatever it uploads, a prerelease included.
          NPM_DIST_TAG: ${{ needs.decide.outputs.channel }}
        # Published from the package directory, not `-w @trazum/core` from the
        # root. With `-w`, npm builds the tarball with the README inside it (pack
        # --dry-run confirms it) but leaves the `readme` field of the version
        # metadata empty, so npmjs.com renders "This package does not have a
        # README" while the file is right there in the tarball. Publishing from
        # the package's own directory makes npm read the README into the
        # metadata. Provenance is unaffected: it is signed from the job's OIDC
        # identity and the Actions environment, not the cwd.
        working-directory: packages/core
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

      # Second, and only if the first succeeded. @trazum/cli depends on
      # @trazum/core at an exact version, so publishing the CLI first would leave
      # a window where installing it fails on a dependency that does not exist.
      - name: Publish @trazum/cli
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # Same fallback as core's step, documented there.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.decide.outputs.channel }}
        # From the package directory, so the README reaches the metadata — see
        # the note on core's step.
        working-directory: packages/cli
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

      # Third, for the same reason the CLI is second: @trazum/mcp pins
      # @trazum/core at an exact version too, so publishing it before core exists
      # leaves a window where installing it fails.
      - name: Publish @trazum/mcp
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # Same fallback as core's step, documented there.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.decide.outputs.channel }}
        # From the package directory, so the README reaches the metadata — see
        # the note on core's step.
        working-directory: packages/mcp
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

      # Last, and the only one here that does not depend on @trazum/core at all:
      # it wraps a third-party tokenizer and is imported by nothing in this
      # repository. Publishing it last keeps the dependency-ordered set above
      # unbroken, and means a failure here cannot strand the three that matter.
      #
      # It is also the one package whose trusted publisher had to be configured
      # separately. A publish to a scope with no trusted publisher for *this*
      # name answers `E404 Not Found - PUT` and spends the version number for
      # nothing — the same failure 1.7.0 hit and the reason
      # `npm-publish-preflight.mjs auth` runs before any of this.
      - name: Publish @trazum/tokenizer-openai
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # Same fallback as core's step, documented there.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.decide.outputs.channel }}
        # From the package directory, so the README reaches the metadata — see
        # the note on core's step.
        working-directory: packages/tokenizer-openai
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

      # A release is not the moment `npm publish` returns. It is the moment a
      # stranger typing `npm install` gets what RELEASES.md says they will, and
      # 1.83.0 proved the two are not the same: the CLI's publish was accepted,
      # signed and logged, and fifteen minutes later the registry was still
      # serving 1.82.0 while its two siblings from the same job were on 1.83.0.
      # Nothing noticed, because the only wait in this workflow was for
      # @trazum/mcp and only because the MCP registry refuses a listing whose
      # package it cannot fetch.
      - name: npm actually serves every package
        if: github.event_name == 'push' && steps.versions.outputs.publish == 'true'
        env:
          # On next it waits for the next tag, and fails at once if latest moved.
          NPM_DIST_TAG: ${{ needs.decide.outputs.channel }}
        run: node scripts/npm-serves.mjs

      # npm reports a write you are not authorised for as `404 Not Found`, which
      # reads as a missing package and is an auth failure. That cost an hour at
      # the first publish and reappeared at 1.9.0, so the workflow says it out
      # loud rather than leaving it in a document somebody has to already know
      # to read.
      #
      # `failure()` rather than a specific step id: any publish failing here is
      # worth this note, and naming one step would go quiet the moment the
      # failure moved to the next package.
      #
      # This note used to end "if the release environment carries the npm
      # token secret, auth came from it and this failure is something else".
      # 2.7.10 failed with the secret set and the token no longer accepted,
      # so the note sent its reader away from the cause. Two credentials can
      # authenticate an upload, and the script asks npm about both again here,
      # the token last: a failed job ends on the line that most often explains
      # it. Hence the token in this step's environment.
      - name: What that failure probably means
        if: failure()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::error::A step failed. If the log says 'E404 Not Found - PUT', that is an"
          echo "::error::authentication failure, not a missing package: npm reports them the same way."
          echo "::error::Two credentials can authenticate an upload. The trusted publisher: npm settings"
          echo "::error::-> Publishing access -> Trusted publisher on each package, with Environment set"
          echo "::error::to 'release', the field people leave blank. And the npm token stored on the"
          echo "::error::release environment, which is the one that has uploaded every release so far"
          echo "::error::and which expires. The lines below say how npm answers each of them now."
          echo "::error::Nothing is half-published: the preflight checks all versions before the first upload."
          node scripts/npm-publish-preflight.mjs claims

      # The release body comes from RELEASES.md, which was written and reviewed in
      # a pull request. Before this, publishing to npm created no GitHub release
      # at all: the tag existed and the page behind it was empty, so anyone
      # arriving from a "what changed?" link got a file list.
      #
      # `release-notes.mjs` exits non-zero when the version has no section, so a
      # release whose notes were never written fails here rather than shipping
      # with a blank page. `publish.test.js` refuses the same thing earlier, at
      # the point of commit; this is the backstop for a tag pushed by hand.
      # A release on latest only: a next has no notes in RELEASES.md, and a
      # GitHub release would be marked the newest one.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && needs.decide.outputs.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "/tmp/sbom/trazum-$GITHUB_REF_NAME.cdx.json" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      # The same release when the trigger was the merge rather than a tag.
      #
      # The tag goes over git first and the release is then created on it.
      # **What can refuse the tag, and why a person then pushes it.** GitHub
      # will not let a token without the `workflows` permission create a ref
      # whose workflow files differ from main's, and GITHUB_TOKEN can never
      # hold that permission. So if a pull request that touches
      # `.github/workflows/` merges while this run is publishing, the tag is
      # refused: 2.7.2 published all four packages and lost its tag and release
      # that way, to a one-line comment change in ci.yml. Through the releases
      # API (`gh release create --target`, the old form of this step) the same
      # refusal read as a bare HTTP 403; over git it names the file, and the
      # step below says what to run. The packages are already on npm by then,
      # so the fix is a tag pushed by a person, never a re-run: the tag-triggered
      # run skips the uploads and creates the release.
      #
      # Don't merge a pull request that touches `.github/workflows/` while a
      # Release run is in progress, and none of this happens.
      #
      # The token reaches git for this one push and nothing else: the checkout
      # keeps no credential, so it is passed as a header on the command line,
      # where Actions masks it. A tag pushed with GITHUB_TOKEN does not
      # retrigger this workflow, and a tag that already exists (a re-run) is
      # left as it is.
      - name: Publish the GitHub release and the tag (from main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.versions.outputs.publish == 'true' && needs.decide.outputs.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$version" > /tmp/release-notes.md
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if ! git -c "http.https://github.com/.extraheader=$auth" ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            if ! git -c "http.https://github.com/.extraheader=$auth" push origin "$GITHUB_SHA:refs/tags/v$version"; then
              echo "::error::v$version is on npm and GitHub refused this token its tag, most likely because a pull request changing .github/workflows/ merged while this run was publishing. Push the tag yourself and the tag-triggered run creates the release: git tag v$version $GITHUB_SHA && git push origin v$version"
              exit 1
            fi
          fi
          gh release create "v$version" \
            "/tmp/sbom/trazum-v$version.cdx.json" \
            --verify-tag \
            --title "v$version" \
            --notes-file /tmp/release-notes.md

      # Checked on manual runs, so a missing notes section is caught by the
      # dry run rather than discovered while releasing.
      #
      # It ends on what npm said about the stored token, because a dry run from
      # a release branch is how that is known before the merge and the end of
      # the log is what the API returns: the verdict is printed forty thousand
      # lines earlier, above `verify`. One of four words the preflight wrote
      # (accepted, refused, absent, unknown), passed through the environment
      # and never spliced into the script.
      - name: Dry run finished
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN_VERDICT: ${{ steps.token.outputs.token }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
        run: |
          if [ "$CHANNEL" = "latest" ]; then node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null; fi
          echo "Dry run: nothing published. Release notes present, or not needed on next. A tag would publish to: $CHANNEL."
          echo "The npm token stored for uploads: ${TOKEN_VERDICT:-not checked}. See the step that asked, or the job summary, for what that means."

  # The files a person downloads from the release page instead of from a
  # package manager: the editor extension as a `.vsix` (Install from VSIX, in VS
  # Code and Cursor), the MCP server as a `.mcpb` bundle (Claude Desktop), and
  # the SHA-256 of each, with the bill of materials, in `SHA256SUMS`. Nothing
  # here is published to a marketplace and no token for one is added.
  #
  # **A separate job after `release`, on purpose.** `release` is where npm
  # serves every package (`npm actually serves every package`) and where the
  # GitHub release is created, so by the time this job starts the packages
  # exist and the page it attaches to exists; the order of the publish steps is
  # not touched. The job also runs two packagers fetched by `npx` at an exact
  # version (see `scripts/release-assets.mjs`), which are third-party code, and
  # it keeps them out of the job that holds `NPM_TOKEN` and `id-token: write`
  # for the same reason the MCP registry listing below is its own job. What it
  # holds is `contents: write`, to attach files to a release, and the token
  # reaches one step: the one that downloads the bill, sums and uploads. The
  # steps that run the packagers have no token in their environment.
  #
  # This job does not attest the files; the `attest` job below does, so that the
  # OIDC token that signs never shares a job with the packagers. `SHA256SUMS`
  # says the files are the ones this job made, to anybody who trusts the
  # release page; the attestation says which workflow, run and commit made them.
  #
  # A manual run builds the files, prints their sums and attaches nothing, so
  # a broken packager is found by a dry run rather than during a release.
  assets:
    name: Attach the downloadable files to the release
    needs: [decide, release]
    # A release on latest: a next has no GitHub release to attach to.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.decide.outputs.channel == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The three workspaces the files are made from, built from this commit:
      # the one `release` published. The extension and the bundle carry
      # `@trazum/core`'s built files, which the lockfile names, and the
      # pricing dataset is checked against the catalogue core was built from.
      - name: Build the workspaces
        run: |
          npm run build -w @trazum/core
          npm run build -w @trazum/mcp
          npm run build -w trazum-vscode

      # The pricing dataset is the file the site serves for this version,
      # copied once it is byte for byte what the catalogue builds; a document
      # that is not the catalogue stops the job here, before any upload.
      - name: Make the .vsix, the .mcpb and the pricing dataset
        run: node scripts/release-assets.mjs build --out /tmp/assets

      - name: Checksums, from a manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          node scripts/release-assets.mjs sums /tmp/assets
          cat /tmp/assets/SHA256SUMS
          echo "Dry run: nothing attached."

      # The one step that holds the token. The bill of materials is already on
      # the release and is downloaded so that `SHA256SUMS` covers it too; the
      # four files named are uploaded, and `--clobber` lets a re-run of this
      # job replace what an earlier attempt left.
      - name: Attach them with their checksums
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          gh release download "v$version" --pattern "trazum-v$version.cdx.json" --dir /tmp/assets
          node scripts/release-assets.mjs sums /tmp/assets
          cat /tmp/assets/SHA256SUMS
          gh release upload "v$version" \
            "/tmp/assets/trazum-vscode-$version.vsix" \
            "/tmp/assets/trazum-mcp-$version.mcpb" \
            "/tmp/assets/trazum-pricing-$version.json" \
            /tmp/assets/SHA256SUMS \
            --clobber

  # Who made the files on the release page, and from which commit (#875). The
  # npm packages carry npm's provenance; the files a person downloads from the
  # release page carried nothing but `SHA256SUMS`, which says what the bytes
  # are and not who built them.
  #
  # This job signs one build-provenance attestation over every file the
  # release carries (the extension, the bundle, the dataset, the bill of
  # materials and `SHA256SUMS`), with GitHub's `actions/attest` and this run's
  # OIDC identity, and attaches the Sigstore bundle to the release as
  # `trazum-v<version>.sigstore.json`, and the same bundle on one line as
  # `trazum-v<version>.intoto.jsonl`, the name a SLSA provenance file goes by
  # (#908). `gh attestation verify` checks a file
  # against it, or against GitHub's attestations API, which holds the same
  # attestation (RELEASES.md, "Checking them").
  #
  # **Its own job, on purpose.** `id-token: write` is the permission that
  # signs, and the `assets` job runs two packagers fetched by `npx`; in the same
  # job they would hold the means to sign anything. Here nothing runs but
  # `gh`, `sha256sum` and GitHub's own action. The files are read back from the
  # release, checked against its `SHA256SUMS` with no file missing, attested,
  # and the bundle is verified against every file before it is attached.
  #
  # After `assets`, so the order of the publishes is untouched: npm first,
  # then the release page, then its files, then this. A manual run builds no
  # release and attests nothing.
  attest:
    name: Attest the files on the release
    needs: [decide, assets]
    if: github.event_name == 'push' && needs.decide.outputs.channel == 'latest'
    runs-on: ubuntu-latest
    permissions:
      # To read the files back and attach the bundle.
      contents: write
      # The OIDC token Sigstore exchanges for the certificate that signs.
      id-token: write
      # To store the attestation where `gh attestation verify` finds it.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the files back from the release and check their sums
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/release
          # The sums name the files relative to their directory, so the check
          # runs there. Outside the checkout `gh` cannot tell which repository
          # it is in, so every `gh` call here names it (#895).
          cd /tmp/release
          for name in "trazum-vscode-$version.vsix" "trazum-mcp-$version.mcpb" "trazum-pricing-$version.json" "trazum-v$version.cdx.json" SHA256SUMS; do
            gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir /tmp/release --clobber
          done
          sha256sum --check --strict SHA256SUMS

      - name: Attest them
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            /tmp/release/trazum-vscode-${{ steps.files.outputs.version }}.vsix
            /tmp/release/trazum-mcp-${{ steps.files.outputs.version }}.mcpb
            /tmp/release/trazum-pricing-${{ steps.files.outputs.version }}.json
            /tmp/release/trazum-v${{ steps.files.outputs.version }}.cdx.json
            /tmp/release/SHA256SUMS

      # The bundle is checked the way RELEASES.md tells a person to check it,
      # against every file, before it is attached: a bundle that verifies
      # nothing is never put on the release page.
      #
      # It goes up twice, under two names, with nothing new signed. The
      # attestation is SLSA provenance (an in-toto Statement v1 with predicate
      # https://slsa.dev/provenance/v1), and `*.intoto.jsonl`, one bundle a
      # line, is where slsa-verifier and Scorecard's Signed-Releases look for
      # one: a `.sigstore.json` scores 8 there, a provenance file 10 (#908).
      # `jq -c` only drops the whitespace, so both files hold the same bytes
      # of signature, and each is verified against every file.
      - name: Verify the bundle against every file, then attach it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.files.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "/tmp/release/trazum-v$VERSION.sigstore.json"
          jq -c . "$BUNDLE" > "/tmp/release/trazum-v$VERSION.intoto.jsonl"
          test "$(wc -l < "/tmp/release/trazum-v$VERSION.intoto.jsonl")" -eq 1
          for bundle in "trazum-v$VERSION.sigstore.json" "trazum-v$VERSION.intoto.jsonl"; do
            for name in "trazum-vscode-$VERSION.vsix" "trazum-mcp-$VERSION.mcpb" "trazum-pricing-$VERSION.json" "trazum-v$VERSION.cdx.json" SHA256SUMS; do
              gh attestation verify "/tmp/release/$name" \
                --bundle "/tmp/release/$bundle" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            done
          done
          gh release upload "v$VERSION" "/tmp/release/trazum-v$VERSION.sigstore.json" "/tmp/release/trazum-v$VERSION.intoto.jsonl" --repo "$GITHUB_REPOSITORY" --clobber

  # The listing on the official MCP registry, which is a separate publish to a
  # separate service and was a manual step until it failed twice in a row.
  #
  # **A separate job on purpose, and the isolation is the point.** This job
  # downloads a third-party binary and runs it. Keeping it out of the release
  # job means that binary never shares a process with `secrets.NPM_TOKEN`, never
  # sees `contents: write`, and cannot touch the packages: by the time it runs,
  # npm has already been published and the GitHub release already exists. The
  # worst this job can do on a bad day is fail, and a failed listing is
  # recoverable by hand — a bad npm publish is not.
  #
  # Gated exactly like the publish steps it follows, so a merge that releases
  # nothing lists nothing.
  mcp-registry:
    name: List on the MCP registry
    needs: [decide, release, assets]
    # Never for a next: the registry would list the prerelease as the server's newest version.
    if: github.event_name == 'push' && needs.decide.outputs.publish == 'true' && needs.decide.outputs.channel == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole reason this can work without a stored credential. The registry
      # exchanges this job's OIDC token for a short-lived registry token, and
      # grants it the namespace matching the token's `repository_owner` claim —
      # `io.github.Davmunrey/*` for this repository. Nothing to rotate, nothing
      # to leak, and a fork cannot mint it.
      id-token: write
    env:
      # Pinned like every action in this repository, and for the same reason:
      # `releases/latest/download` is a movable ref, and this binary runs in a
      # job that can mint a token for the whole namespace. The checksum is the
      # one published for this tag in `registry_<version>_checksums.txt`.
      #
      # When the registry rotates its OIDC audience, an old binary fails with
      # `invalid audience` and the fix is to bump these two lines together. The
      # failure note at the bottom of this job says so, because that error names
      # nothing that would lead you here.
      MCP_PUBLISHER_VERSION: '1.8.1'
      MCP_PUBLISHER_SHA256: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      # The race this job exists to avoid. The registry verifies a listing by
      # reading `mcpName` off the package on npm, and npm serves a new version
      # minutes after the publish returns. See the script.
      - name: Wait for npm to serve this version
        run: node scripts/mcp-registry-preflight.mjs

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          asset="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSL "$base/$asset" -o "$asset"
          echo "${MCP_PUBLISHER_SHA256}  $asset" | sha256sum --check --strict
          tar xzf "$asset" mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      # The bundle the `assets` job attached, listed with its own digest. The
      # committed `server.json` names the npm package only, because the digest
      # of a file built after the release pull request merged cannot be in it;
      # this adds the entry to the copy the publisher sends. It downloads the
      # bundle and `SHA256SUMS` from the release and refuses, writing nothing,
      # when the two disagree, so the listing never carries a digest the file
      # does not have. See `scripts/mcpb-registry-entry.mjs`. This job needs
      # `assets`, so a failed attachment holds the listing back until the job
      # is re-run, and the version is never listed without its bundle.
      - name: List the bundle the release carries
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/mcp/server.json').version")"
          base="https://github.com/TrazumAPP/Trazum/releases/download/v$version"
          mkdir -p /tmp/bundle
          curl -fsSL "$base/trazum-mcp-$version.mcpb" -o "/tmp/bundle/trazum-mcp-$version.mcpb"
          curl -fsSL "$base/SHA256SUMS" -o /tmp/bundle/SHA256SUMS
          node scripts/mcpb-registry-entry.mjs \
            --file "/tmp/bundle/trazum-mcp-$version.mcpb" \
            --sums /tmp/bundle/SHA256SUMS \
            --server packages/mcp/server.json

      - name: Publish the listing
        working-directory: packages/mcp
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/mcp-publisher" publish

      # The listing is metadata somebody else reads, so the job does not end on
      # "the command exited zero". It asks the registry what it now believes.
      # Asks whether the version we just sent is *among* the listings, and keeps
      # asking for a minute. The first version of this step got both halves
      # wrong and failed 1.81.0's release while the publish itself had
      # succeeded, which is the worst way for a check to be wrong: it reported a
      # broken release that was not broken.
      #
      # **It took the first entry the search returned.** The registry keeps
      # every version of a server, so `find(entry => entry.name === name)`
      # answers "some version is listed" and calls it "this version is listed".
      # After 1.81.0 published, the search returned 1.80.1 first and 1.81.0
      # second, so the check read 1.80.1 and failed. That would have failed
      # every release from here on, not just this one.
      #
      # **And it asked once, 0.6 seconds after the publish returned.** The
      # publisher confirms the write; the search index catches up afterwards.
      # `mcp-registry-preflight.mjs` already learned this about npm and polls
      # until the answer arrives. The same lesson had not been applied one step
      # further down.
      #
      # **And it read one page.** The search answers 30 entries at a time and
      # names the next page in `metadata.nextCursor`. 3.0.0 was the thirtieth
      # version, so it was found; 3.0.1, the thirty-first, published correctly
      # and the check failed a minute later, reading only the first page.
      - name: The registry serves what we just sent
        run: |
          set -euo pipefail
          name="$(node -p "require('./packages/mcp/server.json').name")"
          want="$(node -p "require('./packages/mcp/server.json').version")"

          for attempt in $(seq 1 12); do
            listed="$(node -e "
                const [name, want] = process.argv.slice(1);
                const versions = [];
                let cursor;
                (async () => {
                  // Every page: the registry answers 30 entries at a time and
                  // names the next page in metadata.nextCursor, so the version
                  // just sent can sit past the first page.
                  do {
                    const url = new URL('https://registry.modelcontextprotocol.io/v0.1/servers');
                    url.searchParams.set('search', name);
                    if (cursor) url.searchParams.set('cursor', cursor);
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const page = await response.json();
                    for (const entry of page.servers ?? []) {
                      if (entry.server?.name === name) versions.push(entry.server.version);
                    }
                    cursor = page.metadata?.nextCursor;
                  } while (cursor);
                  // Every version the registry holds, so the answer cannot
                  // depend on which one the search happens to return first.
                  console.log(versions.includes(want) ? 'yes' : versions.join(',') || 'none');
                })().catch(() => console.log('unreachable'));
              " "$name" "$want")" || listed='unreachable'

            if [ "$listed" = "yes" ]; then
              echo "$name is listed at $want (after $attempt $([ "$attempt" = 1 ] && echo ask || echo asks))"
              exit 0
            fi
            echo "  $name: registry holds [$listed], waiting for $want"
            sleep 5
          done

          echo "::error::the registry does not list $want for $name after a minute; it holds [$listed]"
          exit 1

      - name: What that failure probably means
        if: failure()
        run: |
          echo "::error::npm is unaffected: the packages published before this job started, and"
          echo "::error::the listing can be published by hand — see 'Listing on the MCP registry'"
          echo "::error::in docs/releasing.md."
          echo "::error::'invalid audience' means MCP_PUBLISHER_VERSION is older than the registry"
          echo "::error::deployment expects. Bump it and MCP_PUBLISHER_SHA256 together, taking the"
          echo "::error::checksum from registry_<version>_checksums.txt on that release."
          echo "::error::A 403 naming two namespaces is the casing of the owner: the grant carries"
          echo "::error::the GitHub login exactly as GitHub spells it. publish.test.js holds"
          echo "::error::server.json and mcpName to the owner in the repository URL."
