name: Release

# Publishing is the one action in this repository that cannot be undone. npm
# allows unpublishing for 72 hours and then the version number is spent for
# good, so everything below is arranged so that a mistake fails the job rather
# than reaching the registry.
#
# Triggered by a tag rather than by a merge: a release is a decision, and the
# tag is where that decision is recorded.
on:
  push:
    tags: ['v*.*.*']
  # Manual runs are dry-run only. A workflow_dispatch that could publish would
  # mean a release with no tag behind it, and nothing to check the version
  # against.
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # The whole point of the design: this is what npm trusted publishing
      # exchanges for a short-lived credential. There is no NPM_TOKEN in this
      # repository's secrets, because a long-lived publish token would be the
      # highest-value credential the project holds and it would sit there
      # permanently for something used a few times a year.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The tag says what is being released. The manifests say what would
      # actually be published. A tag reading v1.2.0 against manifests reading
      # 1.1.0 publishes 1.1.0 under a release note for 1.2.0, and that is the
      # one mistake there is no correcting after 72 hours.
      #
      # `publish.test.js` already asserts that every manifest carries the *same*
      # version. This checks that the shared version is the tagged one.
      - name: The tag and the manifests must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag says $tag, package.json says $manifest"
            exit 1
          fi
          echo "Releasing $manifest"

      # Everything CI runs, in the order CI runs it. Reused rather than
      # reimplemented: a release gate that checks less than the pull-request
      # gate is a gate that lets through exactly what the tag was for.
      - name: Verify
        run: npm run verify

      # `npm publish` runs prepublishOnly, which rebuilds — so what is inspected
      # here has to be built the same way. `pack --dry-run` reports the file list
      # without producing a tarball to clean up.
      - name: Show what would ship
        run: |
          npm pack --dry-run -w @trazum/core
          npm pack --dry-run -w @trazum/cli

      # Provenance comes free with OIDC and is the reason to prefer it beyond
      # not storing a secret: a consumer can verify a published tarball was built
      # from this repository, at this commit, by this workflow.
      - name: Publish @trazum/core
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish -w @trazum/core --provenance --access public

      # Second, and only if the first succeeded. @trazum/cli depends on
      # @trazum/core at an exact version, so publishing the CLI first would leave
      # a window where installing it fails on a dependency that does not exist.
      - name: Publish @trazum/cli
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish -w @trazum/cli --provenance --access public

      - name: Dry run finished
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "Dry run — no tag, nothing published."
