name: Mutation testing

# Changes the core's built code one small thing at a time and fails when a
# change survives that is not on record. What it decides is in
# scripts/mutation.mjs, held by mutation.test.js in the ordinary test run;
# this file says when it runs and installs the one thing it needs.
#
# Why it is its own workflow and not a step of CI: a whole run is long (the
# measured time is in docs/mutation-testing.md), and nobody's pull request
# should wait that long for a line they did not touch. So a pull request is
# asked only about the lines it changes, and every target is run whole weekly.

on:
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'scripts/mutate.mjs'
      - 'scripts/mutation.mjs'
      - 'scripts/mutant-loader.mjs'
      - 'test/mutation-parser.test.mjs'
      - 'mutation.baseline.json'
      - '.github/workflows/mutation.yml'
  schedule:
    # Mondays, after the weekly CI run at 06:41 and the roadmap check at 07:23.
    # A test deleted in a pull request that changed no target is only seen here.
    - cron: '53 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run's answer useless.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  mutate:
    name: No mutant lives that is not on record
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history and its tags, as CI's test job has them. Every
          # test file must pass before a mutant is run, and two of them read
          # the history: with one commit they fail, and the first whole run
          # on a runner stopped there (#698).
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Everything, not only the core that is mutated: the core's tests run the
      # built CLI and read its files. That was the other half of #698.
      - name: Build
        run: npm run build

      # The parser, from tools/acorn, whose lockfile pins it by hash
      # (#874), installed with `--ignore-scripts`: the same arrangement as the
      # privacy probe's browser driver. Nothing published depends on it.
      - name: Install the parser
        run: npm ci --prefix tools/acorn --ignore-scripts --no-audit --no-fund

      - name: The tool reads the real parser's trees the way its tests assume
        env:
          TRAZUM_ACORN: ${{ github.workspace }}/tools/acorn/node_modules/acorn
        run: npm run test:mutation

      - name: Mutants on the lines this pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/mutate.mjs --acorn tools/acorn/node_modules/acorn --since "$BASE_SHA" --check

      # A pull request that changes no target has no mutant to run, and the
      # step above returns before it has run a single test. #695 merged green
      # that way with a workflow that could not run at all. So when the tool,
      # its record or this file changes, one small target is run whole: every
      # test file once, the loader checked, and every mutant of that target.
      - name: One whole target, when the tool itself changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" -- scripts/mutate.mjs scripts/mutation.mjs scripts/mutant-loader.mjs mutation.baseline.json .github/workflows/mutation.yml | grep -q .; then
            node scripts/mutate.mjs --acorn tools/acorn/node_modules/acorn --only savings --check
          else
            echo "The tool, its record and its workflow are unchanged: nothing more to run."
          fi

      - name: Every mutant of every target
        if: github.event_name != 'pull_request'
        run: node scripts/mutate.mjs --acorn tools/acorn/node_modules/acorn --check
