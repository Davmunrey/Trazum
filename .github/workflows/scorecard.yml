name: Scorecard

# OpenSSF Scorecard reads the repository from outside: pinned actions, token
# permissions, branch protection, code review, signed releases and the rest of
# its checks, and publishes the score the README's badge shows (#787). It is
# not a required check; it measures, and nothing waits on it.
#
# Publishing is why this file is shaped the way it is. The Scorecard API
# refuses a result from a workflow that has top-level env or defaults, a write
# permission at the top, `id-token: write` on any job but this one, or a step
# from outside its list of approved actions (checkout, upload-artifact,
# codeql-action/upload-sarif, scorecard-action, harden-runner). Those rules
# are in the action's README at the pinned commit, "Workflow Restrictions",
# and `workflow-guards.test.js` holds them here.

on:
  push:
    branches: ['main']
  schedule:
    # Weekly, so a change in a setting nobody committed (branch protection,
    # a token's default) still moves the score.
    - cron: '29 5 * * 3'

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # The results go to the Security tab as SARIF.
      security-events: write
      # The OIDC token the Scorecard API reads to accept a published result.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
