name: 'Trazum Check'
# Kept under 125 characters: the Marketplace rejects anything longer, and it
# is the one line most people read before deciding to try this.
description: 'Token budget for prompts. Fails the build when a prompt busts its maximum, and says whether optimising would fit.'
author: 'David Muñoz Rey'
branding:
  icon: 'scissors'
  color: 'orange'

inputs:
  file:
    description: 'Path to the prompt file to check, relative to the workspace.'
    required: true
  max-tokens:
    description: 'Maximum input token budget.'
    required: true
  level:
    description: 'Rule level used to work out whether the optimised prompt would fit: safe or aggressive.'
    required: false
    default: 'safe'
  locale:
    description: 'Language of the report: en or es. Defaults to English.'
    required: false
    default: 'en'

runs:
  using: 'composite'
  steps:
    - name: Build Trazum
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --no-audit --no-fund
        npm run build

    - name: Check the budget
      shell: bash
      run: >-
        node "${{ github.action_path }}/packages/cli/dist/index.js" check
        "${{ inputs.file }}"
        --max-tokens "${{ inputs.max-tokens }}"
        --level "${{ inputs.level }}"
        --locale "${{ inputs.locale }}"
