name: 'Trazum Check'
description: >-
  Token budget for prompts: fails the build when a prompt busts the given
  maximum, and tells you whether optimising it would fit.
author: 'David Muñoz Rey'
branding:
  icon: 'scissors'
  color: 'orange'

inputs:
  file:
    description: 'Path to the prompt file to check, relative to the workspace.'
    required: true
  max-tokens:
    description: 'Maximum input token budget.'
    required: true
  level:
    description: 'Rule level used to work out whether the optimised prompt would fit: safe or aggressive.'
    required: false
    default: 'safe'
  locale:
    description: 'Language of the report: en or es. Defaults to English.'
    required: false
    default: 'en'

runs:
  using: 'composite'
  steps:
    - name: Build Trazum
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --no-audit --no-fund
        npm run build

    - name: Check the budget
      shell: bash
      run: >-
        node "${{ github.action_path }}/packages/cli/dist/index.js" check
        "${{ inputs.file }}"
        --max-tokens "${{ inputs.max-tokens }}"
        --level "${{ inputs.level }}"
        --locale "${{ inputs.locale }}"
