name: 'Trazum Check'
# Kept under 125 characters: the Marketplace rejects anything longer, and it
# is the one line most people read before deciding to try this.
#
# It has to name BOTH gates. This said "Token budget for prompts" while seven
# of the eighteen inputs below drove a spend gate that reads a usage log, so
# the one line a Marketplace visitor reads described a version of this action
# that stopped being the whole story several releases ago. security.test.js
# now derives the modes from the script and fails when one is unnamed.
description: 'Fails the build when a prompt busts its token budget or a log its spend budget. Can post a weekly summary or a plan PR.'
author: 'David Muñoz Rey'
branding:
  icon: 'scissors'
  color: 'orange'

inputs:
  target:
    description: 'Prompt file or directory to check, relative to the workspace. A directory uses the budgets in trazum.config.json.'
    required: false
  file:
    description: 'Deprecated alias for target, kept so existing workflows keep working. Prefer target.'
    required: false
  max-tokens:
    description: 'Maximum input token budget. Optional when trazum.config.json carries a budget covering the target.'
    required: false
  config:
    description: 'Path to a trazum.config.json. Defaults to searching upward from the workspace.'
    required: false
  level:
    description: 'Rule level used to work out whether the optimised prompt would fit: safe or aggressive. Defaults to the config file, then safe.'
    required: false
  locale:
    description: 'Language of the report: en or es. Defaults to the config file, then English.'
    required: false
  comment:
    description: 'Post the report as a pull request comment, replacing the previous one. Needs github-token and pull-requests write.'
    required: false
    default: 'false'
  comment-key:
    description: 'Distinguishes comments from two runs reporting on different things in the same pull request.'
    required: false
    default: 'default'
  suggest-fixes:
    description: 'Post the optimised prompt as a GitHub suggested change, applied with one button. Needs github-token and pull-requests write. Safe level only. A suggestion can only anchor to lines in the diff, so a prompt only partly changed by the pull request gets a notice instead.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to post the comment and any suggestions. Only read when comment or suggest-fixes is true.'
    required: false
  usage-log:
    description: 'Usage log (JSONL) to profile instead of checking prompts — the spend gate. Mutually exclusive with target: a run gates either tokens before the money is spent, or the spend itself, and saying which is the caller''s job.'
    required: false
  max-usd:
    description: 'With usage-log: fail the build when the log spent more than this many dollars. No period is assumed — the budget applies to exactly the log handed in, so profiling yesterday''s log nightly is a daily budget.'
    required: false
  against:
    description: 'With usage-log: a previous log to compare against. Drivers are ranked in the report; pair with max-growth-usd to gate on growth.'
    required: false
  max-growth-usd:
    description: 'With usage-log and against: fail the build when the bill grew more than this many dollars over the previous log.'
    required: false
  max-cache-loss-usd:
    description: 'With usage-log: fail the build when caching added more than this many dollars to the bill. Reads the worst case when the log did not record the write TTL — a gate reading the flattering half would pass the bills it exists to catch.'
    required: false
  label:
    description: 'With usage-log: profile only the calls carrying this label — one workload''s budget. A label matching nothing fails the run naming the labels that exist.'
    required: false
  since:
    description: 'With usage-log: profile only calls at or after this moment — a UTC day (2026-08-14) or a full ISO 8601 timestamp. Calls with no "ts" are excluded and counted out loud in the report.'
    required: false
  until:
    description: 'With usage-log: profile only calls up to this moment; a bare date includes that whole UTC day. A window the log does not cover fails the run naming what it does. With weekly-summary: where the week ends (default now).'
    required: false
  weekly-summary:
    description: 'Write the week as a summary (the bill, what moved against the week before, the three changes to make first) from usage-log, and post it where you name: "issue" opens one issue for the week, "comment" adds one comment on the standing issue named by weekly-summary-issue. Needs github-token and issues write. Empty, the default, posts nothing. Mutually exclusive with target and with every gate.'
    required: false
  weekly-summary-issue:
    description: 'With weekly-summary set to comment: the number of the standing issue the summary is commented on. The only place it comments.'
    required: false
  plan-pull-request:
    description: 'With usage-log: make the plan (trazum plan --edits), make its edits to the prompt files trazum.config.json maps a label to on a new branch, and open one pull request whose body is the plan. Needs github-token, contents write and pull-requests write, which only this step uses. Once per plan; never pushes to the default branch or merges. Off unless "true". Mutually exclusive with target, weekly-summary and every gate.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Build Trazum
      shell: bash
      working-directory: ${{ github.action_path }}
      # --ignore-scripts stops a dependency's lifecycle hook running arbitrary
      # code inside someone else's workflow. This repository's own CI has had
      # it from the start; the action, which is what other people run, did not.
      # That was backwards.
      run: |
        npm ci --no-audit --no-fund --ignore-scripts
        npm run build

    - name: Check the budget
      id: check
      shell: bash
      # Inputs go through the environment rather than being interpolated into
      # the script. `${{ inputs.file }}` spliced into `run:` is the classic
      # Actions template-injection shape: the value is workflow-authored today,
      # but one step that derives it from a pull request title or branch name
      # turns it into shell. Quoting inside the template is not a fix — the
      # substitution happens before bash ever sees it. Asserted in
      # packages/core/test/security.test.js, with positive controls.
      env:
        TRAZUM_TARGET: ${{ inputs.target }}
        TRAZUM_FILE: ${{ inputs.file }}
        TRAZUM_MAX_TOKENS: ${{ inputs.max-tokens }}
        TRAZUM_CONFIG: ${{ inputs.config }}
        TRAZUM_LEVEL: ${{ inputs.level }}
        TRAZUM_REPORT_LOCALE: ${{ inputs.locale }}
        TRAZUM_USAGE_LOG: ${{ inputs.usage-log }}
        TRAZUM_MAX_USD: ${{ inputs.max-usd }}
        TRAZUM_AGAINST: ${{ inputs.against }}
        TRAZUM_MAX_GROWTH_USD: ${{ inputs.max-growth-usd }}
        TRAZUM_MAX_CACHE_LOSS_USD: ${{ inputs.max-cache-loss-usd }}
        TRAZUM_LABEL: ${{ inputs.label }}
        TRAZUM_SINCE: ${{ inputs.since }}
        TRAZUM_UNTIL: ${{ inputs.until }}
        TRAZUM_WEEKLY_SUMMARY: ${{ inputs.weekly-summary }}
        TRAZUM_PLAN_PULL_REQUEST: ${{ inputs.plan-pull-request }}
        TRAZUM_ACTION_PATH: ${{ github.action_path }}
      # Every optional flag is added only when it was actually given. Passing
      # `--level safe` unconditionally is what made a config file's `level` and
      # `locale` unreachable through this action in 0.10.0: the CLI layers flags
      # over config over defaults, so an always-present flag means the config's
      # value is never read. A default that silently overrides a project's own
      # setting is worse than no default at all.
      #
      # The check is allowed to fail without ending the job here, so the report
      # still reaches the summary and the comment. The verdict is re-raised in the
      # last step, so a busted budget still fails the build.
      run: |
        set -uo pipefail

        target="${TRAZUM_TARGET:-$TRAZUM_FILE}"
        # The plan's pull request is a fourth mode, exclusive like the rest,
        # and the only one that writes to the repository (#796). It writes
        # the plan and its Markdown here and nothing else; the step that
        # opens the pull request is the one holding the token.
        if [ "$TRAZUM_PLAN_PULL_REQUEST" != "false" ] && [ -n "$TRAZUM_PLAN_PULL_REQUEST" ]; then
          if [ "$TRAZUM_PLAN_PULL_REQUEST" != "true" ]; then
            echo "::error title=Trazum::The 'plan-pull-request' input is 'true' or 'false'. '$TRAZUM_PLAN_PULL_REQUEST' is neither."
            echo "outcome=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TRAZUM_USAGE_LOG" ] || [ -n "$target" ] || [ -n "$TRAZUM_WEEKLY_SUMMARY" ]; then
            echo "::error title=Trazum::Set 'usage-log' (and not 'target' or 'weekly-summary') with 'plan-pull-request': the plan is made from a usage log."
            echo "outcome=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TRAZUM_MAX_USD$TRAZUM_AGAINST$TRAZUM_MAX_GROWTH_USD$TRAZUM_MAX_CACHE_LOSS_USD$TRAZUM_LABEL$TRAZUM_SINCE$TRAZUM_UNTIL" ]; then
            echo "::error title=Trazum::'plan-pull-request' proposes edits and gates nothing, over the whole log. Remove max-usd, against, max-growth-usd, max-cache-loss-usd, label, since and until, or run the gate in its own step."
            echo "outcome=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(plan "$TRAZUM_USAGE_LOG" --edits --out "$RUNNER_TEMP/trazum-plan.json" --markdown-out "$RUNNER_TEMP/trazum-report.md")
          [ -n "$TRAZUM_CONFIG" ] && args+=(--config "$TRAZUM_CONFIG")
          [ -n "$TRAZUM_REPORT_LOCALE" ] && args+=(--locale "$TRAZUM_REPORT_LOCALE")
          node "$TRAZUM_ACTION_PATH/packages/cli/dist/index.js" "${args[@]}"
          echo "outcome=$?" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The weekly summary is a third mode and exclusive like the other two:
        # it reads a log and writes a note, it gates nothing, and a run that
        # also carried a budget would leave the reader unsure which verdict
        # the red build was. Refused naming what was mixed.
        if [ -n "$TRAZUM_WEEKLY_SUMMARY" ]; then
          if [ "$TRAZUM_WEEKLY_SUMMARY" != "issue" ] && [ "$TRAZUM_WEEKLY_SUMMARY" != "comment" ]; then
            echo "::error title=Trazum::The 'weekly-summary' input is 'issue' or 'comment', the one place the owner chose. '$TRAZUM_WEEKLY_SUMMARY' is neither."
            echo "outcome=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TRAZUM_USAGE_LOG" ] || [ -n "$target" ]; then
            echo "::error title=Trazum::Set 'usage-log' (and not 'target') with 'weekly-summary': the summary is written from a usage log."
            echo "outcome=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TRAZUM_MAX_USD$TRAZUM_AGAINST$TRAZUM_MAX_GROWTH_USD$TRAZUM_MAX_CACHE_LOSS_USD$TRAZUM_SINCE" ]; then
            echo "::error title=Trazum::'weekly-summary' writes a note and gates nothing, and its week is the seven days before 'until'. Remove max-usd, against, max-growth-usd, max-cache-loss-usd and since, or run the gate in its own step."
            echo "outcome=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(weekly "$TRAZUM_USAGE_LOG" --out "$RUNNER_TEMP/trazum-report.md")
          [ -n "$TRAZUM_LABEL" ] && args+=(--label "$TRAZUM_LABEL")
          [ -n "$TRAZUM_UNTIL" ] && args+=(--until "$TRAZUM_UNTIL")
          [ -n "$TRAZUM_CONFIG" ] && args+=(--config "$TRAZUM_CONFIG")
          [ -n "$TRAZUM_REPORT_LOCALE" ] && args+=(--locale "$TRAZUM_REPORT_LOCALE")
          node "$TRAZUM_ACTION_PATH/packages/cli/dist/index.js" "${args[@]}"
          echo "outcome=$?" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Two modes, mutually exclusive: gate the tokens before the money is
        # spent (check), or gate the spend itself (profile). A run doing both
        # would fold two verdicts into one exit code, and saying which gate
        # fired is the whole point of having one.
        if [ -n "$TRAZUM_USAGE_LOG" ] && [ -n "$target" ]; then
          echo "::error title=Trazum::Set 'target' or 'usage-log', not both — one run gates prompts or the spend, and saying which is the caller's job."
          echo "outcome=1" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$target" ] && [ -z "$TRAZUM_USAGE_LOG" ]; then
          echo "::error title=Trazum::Set the 'target' input to the prompt file or directory to check, or 'usage-log' to gate the spend."
          echo "outcome=1" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$TRAZUM_FILE" ] && [ -z "$TRAZUM_TARGET" ]; then
          echo "::warning title=Trazum::The 'file' input is deprecated; rename it to 'target'."
        fi

        if [ -n "$TRAZUM_USAGE_LOG" ]; then
          args=(profile "$TRAZUM_USAGE_LOG")
          [ -n "$TRAZUM_MAX_USD" ] && args+=(--max-usd "$TRAZUM_MAX_USD")
          [ -n "$TRAZUM_AGAINST" ] && args+=(--against "$TRAZUM_AGAINST")
          [ -n "$TRAZUM_MAX_GROWTH_USD" ] && args+=(--max-growth-usd "$TRAZUM_MAX_GROWTH_USD")
          [ -n "$TRAZUM_MAX_CACHE_LOSS_USD" ] && args+=(--max-cache-loss-usd "$TRAZUM_MAX_CACHE_LOSS_USD")
          # The drill-downs compose with the gates: one workload's budget, or
          # one period's. The CLI owns the honesty rules (a label or window
          # matching nothing is an error, clockless calls are counted out
          # loud), so this only forwards.
          [ -n "$TRAZUM_LABEL" ] && args+=(--label "$TRAZUM_LABEL")
          [ -n "$TRAZUM_SINCE" ] && args+=(--since "$TRAZUM_SINCE")
          [ -n "$TRAZUM_UNTIL" ] && args+=(--until "$TRAZUM_UNTIL")
        else
          args=(check "$target")
          [ -n "$TRAZUM_MAX_TOKENS" ] && args+=(--max-tokens "$TRAZUM_MAX_TOKENS")
          [ -n "$TRAZUM_LEVEL" ] && args+=(--level "$TRAZUM_LEVEL")
        fi
        [ -n "$TRAZUM_CONFIG" ] && args+=(--config "$TRAZUM_CONFIG")
        [ -n "$TRAZUM_REPORT_LOCALE" ] && args+=(--locale "$TRAZUM_REPORT_LOCALE")
        args+=(--markdown-out "$RUNNER_TEMP/trazum-report.md")

        node "$TRAZUM_ACTION_PATH/packages/cli/dist/index.js" "${args[@]}"
        echo "outcome=$?" >> "$GITHUB_OUTPUT"

    - name: Add the report to the run summary
      shell: bash
      # always(), because the step above can exit non-zero and a composite action
      # skips the rest of its steps on failure. A summary that only appears when
      # the check passed is a summary nobody needs.
      #
      # Not behind an input, either: writing a step summary needs no token, no
      # permission and no pull request, and has no failure mode worth a switch.
      if: always()
      run: |
        report="$RUNNER_TEMP/trazum-report.md"
        if [ -s "$report" ]; then
          cat "$report" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        fi
        exit 0

    - name: Comment on the pull request
      shell: bash
      if: always() && inputs.comment == 'true'
      env:
        TRAZUM_GITHUB_TOKEN: ${{ inputs.github-token }}
        TRAZUM_MARKER_KEY: ${{ inputs.comment-key }}
        TRAZUM_REPORT_LOCALE: ${{ inputs.locale }}
        TRAZUM_OUTCOME: ${{ steps.check.outputs.outcome }}
        TRAZUM_ACTION_PATH: ${{ github.action_path }}
      # Never fails the build: no pull request, a read-only token on a fork, or
      # comments disabled all print a notice and exit 0. The report has already
      # reached the run summary by this point, so nothing is lost either way.
      #
      # The report path is built from $RUNNER_TEMP in the shell rather than from
      # ${{ runner.temp }} in an env value, so every template expression in this
      # file is a *bare* assignment or a condition. That is a rule a reader can
      # check at a glance, and one a test can assert without a judgement call
      # about which suffixes are safe.
      run: |
        TRAZUM_BODY_PATH="$RUNNER_TEMP/trazum-report.md" \
          node "$TRAZUM_ACTION_PATH/action/post-comment.mjs" || true

    - name: Report the budget verdict
      shell: bash
      # The exit code belongs to the budget and nothing else. Raised here rather
      # than in the check step so the reporting above always runs — and raised
      # unconditionally so a busted budget still fails the build. A missing
      # outcome is treated as a failure: the check step not reaching its own
      # last line means something went wrong that nobody should call green.
      if: always()
      env:
        TRAZUM_OUTCOME: ${{ steps.check.outputs.outcome }}
        TRAZUM_USAGE_LOG: ${{ inputs.usage-log }}
        TRAZUM_WEEKLY_SUMMARY: ${{ inputs.weekly-summary }}
        TRAZUM_PLAN_PULL_REQUEST: ${{ inputs.plan-pull-request }}
      run: |
        if [ "${TRAZUM_OUTCOME:-1}" != "0" ]; then
          if [ "$TRAZUM_PLAN_PULL_REQUEST" = "true" ]; then
            echo "::error title=Trazum::The plan could not be made. See the log above: no pull request was opened."
          elif [ -n "$TRAZUM_WEEKLY_SUMMARY" ]; then
            echo "::error title=Trazum::The weekly summary could not be written. See the log above: nothing was posted."
          elif [ -n "$TRAZUM_USAGE_LOG" ]; then
            echo "::error title=Trazum::The spend gate failed — the log is over its budget or grew past its limit, or the profile could not run. See the run summary."
          else
            echo "::error title=Trazum::A prompt busts its token budget, or the check could not run. See the run summary."
          fi
          exit 1
        fi

    - name: Post the weekly summary
      shell: bash
      # Only when the owner chose a place: 'issue' or 'comment', and nothing
      # else is a place. Never fails the build, like the comment step: the
      # summary is already on the job page, and the verdict above belongs to
      # the writing of it.
      #
      # The token is the one the workflow gave, passed through the environment
      # to the one script that talks to GitHub. The CLI that wrote the summary
      # never receives it.
      if: always() && (inputs.weekly-summary == 'issue' || inputs.weekly-summary == 'comment') && steps.check.outputs.outcome == '0'
      env:
        TRAZUM_GITHUB_TOKEN: ${{ inputs.github-token }}
        TRAZUM_SUMMARY_TARGET: ${{ inputs.weekly-summary }}
        TRAZUM_SUMMARY_ISSUE: ${{ inputs.weekly-summary-issue }}
        TRAZUM_ACTION_PATH: ${{ github.action_path }}
      run: |
        TRAZUM_BODY_PATH="$RUNNER_TEMP/trazum-report.md" \
          node "$TRAZUM_ACTION_PATH/action/post-weekly.mjs" || true

    - name: Open the plan's pull request
      shell: bash
      # The one step of this Action that writes to a repository (#796): a
      # branch, a commit and a pull request, through the API. A workflow
      # using it gives its job contents: write and pull-requests: write, and
      # puts nothing else in that job; docs/ci.md shows the job. The token
      # reaches this step through the environment and the CLI never sees it.
      #
      # Never fails the build, like the other posting steps: the plan is on
      # the job's summary page, and the verdict above belongs to making it.
      if: always() && inputs.plan-pull-request == 'true' && steps.check.outputs.outcome == '0'
      env:
        TRAZUM_GITHUB_TOKEN: ${{ inputs.github-token }}
        TRAZUM_ACTION_PATH: ${{ github.action_path }}
      run: |
        TRAZUM_PLAN_PATH="$RUNNER_TEMP/trazum-plan.json" TRAZUM_BODY_PATH="$RUNNER_TEMP/trazum-report.md" \
          node "$TRAZUM_ACTION_PATH/action/open-plan-pr.mjs" || true

    - name: Suggest the optimised prompts
      shell: bash
      if: always() && inputs.suggest-fixes == 'true'
      env:
        TRAZUM_GITHUB_TOKEN: ${{ inputs.github-token }}
        TRAZUM_ACTION_PATH: ${{ github.action_path }}
      # Never fails the build, exactly like the comment step: no pull request, a
      # read-only token on a fork, or the API declining are all notices. The budget
      # verdict is raised separately and is the only thing that can turn this red.
      #
      # It posts *suggestions*, not commits. A commit would need `contents: write`
      # on this workflow, and SECURITY.md documents `contents: read` — widening that
      # is the caller's decision, not this action's convenience.
      run: |
        node "$TRAZUM_ACTION_PATH/action/suggest-fixes.mjs" || true
