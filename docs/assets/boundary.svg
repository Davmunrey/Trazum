<svg xmlns="http://www.w3.org/2000/svg" width="880" height="442" viewBox="0 0 880 442" role="img">
<title>What goes in, what is computed on your machine, and what leaves</title>
<rect width="880" height="442" rx="10" fill="#171512"/>
<text x="28" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#efece4" font-weight="700" text-anchor="start">What goes in, what is computed here, and what comes out</text>
<text x="28" y="55" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a8a495" font-weight="400" text-anchor="start">Every figure is computed on the machine that runs it.</text>
<text x="28" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">YOU POINT IT AT</text>
<rect x="28" y="100" width="168" height="50" rx="7" fill="#1e1c18" stroke="#302c26" stroke-width="1"/>
<text x="42" y="121" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#efece4" font-weight="400" text-anchor="start">a prompt</text>
<text x="42" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a8a495" font-weight="400" text-anchor="start">text on your disk</text>
<rect x="28" y="162" width="168" height="64" rx="7" fill="#1e1c18" stroke="#302c26" stroke-width="1"/>
<text x="42" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#efece4" font-weight="400" text-anchor="start">a usage log</text>
<text x="42" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">OTel · LiteLLM · Helicone</text>
<text x="42" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">LangSmith · Claude Code</text>
<rect x="248" y="78" width="326" height="262" rx="7" fill="#1a1815" stroke="#302c26" stroke-width="1"/>
<text x="264" y="97" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">THIS MACHINE · OFFLINE · DETERMINISTIC</text>
<rect x="264" y="108" width="294" height="48" rx="7" fill="#1e1c18" stroke="#b0522f" stroke-width="1"/>
<text x="278" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#efece4" font-weight="700" text-anchor="start">@trazum/core</text>
<text x="278" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a8a495" font-weight="400" text-anchor="start">zero dependencies · no network</text>
<rect x="264" y="166" width="294" height="28" rx="7" fill="#1e1c18" stroke="#302c26" stroke-width="1"/>
<text x="278" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#efece4" font-weight="400" text-anchor="start">@trazum/cli</text>
<rect x="264" y="200" width="294" height="28" rx="7" fill="#1e1c18" stroke="#302c26" stroke-width="1"/>
<text x="278" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#efece4" font-weight="400" text-anchor="start">@trazum/mcp</text>
<rect x="264" y="234" width="294" height="28" rx="7" fill="#1e1c18" stroke="#302c26" stroke-width="1"/>
<text x="278" y="253" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#efece4" font-weight="400" text-anchor="start">action/</text>
<rect x="264" y="272" width="294" height="28" rx="7" fill="#1e1c18" stroke="#302c26" stroke-dasharray="4 3" stroke-width="1"/>
<text x="278" y="291" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a8a495" font-weight="400" text-anchor="start">@trazum/tokenizer-openai  ·  optional</text>
<text x="264" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#d6ad63" font-weight="400" text-anchor="start">llm.ts and tokenizer.ts may reach a network, opt-in only.</text>
<text x="264" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#d6ad63" font-weight="400" text-anchor="start">A third module mentioning fetch fails the build.</text>
<line x1="608" y1="78" x2="608" y2="340" stroke="#b0522f" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="608" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#b0522f" font-weight="700" text-anchor="middle">THE LINE</text>
<text x="640" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">WHAT LEAVES</text>
<rect x="640" y="100" width="212" height="44" rx="7" fill="#1e1c18" stroke="#6fc99a" stroke-width="1"/>
<text x="654" y="119" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#efece4" font-weight="400" text-anchor="start">a receipt</text>
<text x="654" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">counts · money · rates</text>
<line x1="574" y1="122" x2="633" y2="122" stroke="#6fc99a" stroke-width="1.4"/><path d="M640 122 L633 118.5 L633 125.5 Z" fill="#6fc99a"/>
<rect x="640" y="154" width="212" height="44" rx="7" fill="#1e1c18" stroke="#6fc99a" stroke-width="1"/>
<text x="654" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#efece4" font-weight="400" text-anchor="start">a report</text>
<text x="654" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">terminal · markdown · CSV</text>
<line x1="574" y1="176" x2="633" y2="176" stroke="#6fc99a" stroke-width="1.4"/><path d="M640 176 L633 172.5 L633 179.5 Z" fill="#6fc99a"/>
<rect x="640" y="208" width="212" height="44" rx="7" fill="#1e1c18" stroke="#6fc99a" stroke-width="1"/>
<text x="654" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#efece4" font-weight="400" text-anchor="start">a gate verdict</text>
<text x="654" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#a8a495" font-weight="400" text-anchor="start">pass or fail a build</text>
<line x1="574" y1="230" x2="633" y2="230" stroke="#6fc99a" stroke-width="1.4"/><path d="M640 230 L633 226.5 L633 233.5 Z" fill="#6fc99a"/>
<line x1="196" y1="125" x2="241" y2="125" stroke="#b0522f" stroke-width="1.4"/><path d="M248 125 L241 121.5 L241 128.5 Z" fill="#b0522f"/>
<line x1="196" y1="194" x2="241" y2="194" stroke="#b0522f" stroke-width="1.4"/><path d="M248 194 L241 190.5 L241 197.5 Z" fill="#b0522f"/>
<rect x="28" y="362" width="824" height="56" rx="7" fill="#20150f" stroke="#b0522f" stroke-dasharray="4 3" stroke-width="1"/>
<text x="44" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#b0522f" font-weight="700" text-anchor="start">Never crosses the line</text>
<text x="44" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#efece4" font-weight="400" text-anchor="start">the prompt text · the model’s answer · file paths · branch names · credentials</text>
<text x="44" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#a8a495" font-weight="400" text-anchor="start">Not redacted, not hashed — absent. receipt-redaction.test.js plants all five and fails if any appears.</text>
</svg>
