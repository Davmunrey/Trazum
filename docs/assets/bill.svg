<svg xmlns="http://www.w3.org/2000/svg" width="650" height="548" viewBox="0 0 650 548" role="img" aria-label="trazum bill on two illustrative Claude Code projects: $12.70 across 126 priced call(s), by project and by model, with the calls it could not price named rather than counted as zero">
  <!--
    Drawn by scripts/draw-bill.mjs from what `trazum bill examples/claude-projects` prints, in English,
    forced into its terminal statement because a script runs it in a pipe.
    Do not edit: redraw. The suite fails when this stops being that output.
    (An XML comment cannot hold two hyphens in a row, which is why no flag
    is spelled out here.)
  -->
  <rect x="1" y="1" width="648" height="546" fill="#1c211b" stroke="#67715c" stroke-width="2"/>
  <rect x="2" y="2" width="646" height="40" fill="#242a21"/>
  <line x1="2" y1="42" x2="648" y2="42" stroke="#67715c" stroke-width="1"/>
  <g transform="translate(14 11) scale(0.55)"><path fill="#dce94d" stroke="#20231e" stroke-width="3" d="M1.5 1.5h37v37h-37z"/><path fill="#20231e" d="M9 10h22v6h-8v15h-6V16H9z"/></g>
  <text x="46" y="28" font-family="'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="-0.4" fill="#f0f1e5">Trazum</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="22" y="72"><tspan fill="#dce94d" font-weight="bold">$</tspan><tspan fill="#f0f1e5">&#160;trazum&#160;bill&#160;examples/claude-projects</tspan></text>
    <text x="22" y="104"><tspan fill="#f0f1e5" font-weight="bold">Your&#160;bill</tspan><tspan fill="#f0f1e5">&#160;</tspan><tspan fill="#67715c">────────────────────────────────────────────────────────────────</tspan></text>
    <text x="22" y="125"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#f0f1e5" font-weight="bold">$12.70&#160;across&#160;126&#160;priced&#160;call(s)</tspan></text>
    <text x="22" y="146"><tspan fill="#c0c6af">&#160;&#160;This&#160;log&#160;covers&#160;2026-09-01&#160;→&#160;2026-09-14&#160;(13.3&#160;days):&#160;stated,&#160;never</tspan></text>
    <text x="22" y="167"><tspan fill="#c0c6af">&#160;&#160;extrapolated.&#160;Scale&#160;it&#160;to&#160;a&#160;month&#160;yourself,&#160;now&#160;that&#160;you&#160;know&#160;what&#160;it</tspan></text>
    <text x="22" y="188"><tspan fill="#c0c6af">&#160;&#160;covers.</tspan></text>
    <text x="22" y="209"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#d6ad63">Agent&#160;sessions&#160;(Claude&#160;Code,&#160;Codex,&#160;Gemini&#160;CLI)&#160;are&#160;priced&#160;at&#160;catalogue</tspan></text>
    <text x="22" y="230"><tspan fill="#d6ad63">&#160;&#160;API&#160;rates.&#160;On&#160;a&#160;subscription&#160;you&#160;paid&#160;the&#160;plan,&#160;not&#160;this&#160;API-equivalent</tspan></text>
    <text x="22" y="251"><tspan fill="#d6ad63">&#160;&#160;estimate;&#160;missing&#160;telemetry&#160;and&#160;custom&#160;rates&#160;can&#160;change&#160;the&#160;result.</tspan></text>
    <text x="22" y="293"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">project</tspan><tspan fill="#f0f1e5">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c0c6af">calls</tspan><tspan fill="#f0f1e5">&#160;&#160;&#160;&#160;</tspan><tspan fill="#c0c6af">USD</tspan><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">share</tspan></text>
    <text x="22" y="314"><tspan fill="#f0f1e5">&#160;&#160;home-me-etl-pipeline&#160;&#160;&#160;&#160;&#160;42&#160;&#160;$9.05&#160;&#160;</tspan><tspan fill="#dce94d" stroke="#dce94d" stroke-width="0.6">███████</tspan><tspan fill="#67715c">░░░</tspan><tspan fill="#f0f1e5">&#160;71.2%</tspan></text>
    <text x="22" y="335"><tspan fill="#f0f1e5">&#160;&#160;home-me-webapp&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;84&#160;&#160;$3.66&#160;&#160;</tspan><tspan fill="#dce94d" stroke="#dce94d" stroke-width="0.6">███</tspan><tspan fill="#67715c">░░░░░░░</tspan><tspan fill="#f0f1e5">&#160;28.8%</tspan></text>
    <text x="22" y="377"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">model</tspan><tspan fill="#f0f1e5">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c0c6af">calls</tspan><tspan fill="#f0f1e5">&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c0c6af">USD</tspan><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">share</tspan></text>
    <text x="22" y="398"><tspan fill="#f0f1e5">&#160;&#160;claude-fable-5-1&#160;&#160;&#160;&#160;&#160;&#160;28&#160;&#160;&#160;&#160;$9.00&#160;&#160;</tspan><tspan fill="#dce94d" stroke="#dce94d" stroke-width="0.6">███████</tspan><tspan fill="#67715c">░░░</tspan><tspan fill="#f0f1e5">&#160;70.9%</tspan></text>
    <text x="22" y="419"><tspan fill="#f0f1e5">&#160;&#160;claude-opus-5-5&#160;&#160;&#160;&#160;&#160;&#160;&#160;56&#160;&#160;&#160;&#160;$2.95&#160;&#160;</tspan><tspan fill="#dce94d" stroke="#dce94d" stroke-width="0.6">██</tspan><tspan fill="#67715c">░░░░░░░░</tspan><tspan fill="#f0f1e5">&#160;23.2%</tspan></text>
    <text x="22" y="440"><tspan fill="#f0f1e5">&#160;&#160;claude-sonnet-5-5&#160;&#160;&#160;&#160;&#160;28&#160;&#160;$0.7077&#160;&#160;</tspan><tspan fill="#dce94d" stroke="#dce94d" stroke-width="0.6">█</tspan><tspan fill="#67715c">░░░░░░░░░</tspan><tspan fill="#f0f1e5">&#160;5.6%</tspan></text>
    <text x="22" y="461"><tspan fill="#f0f1e5">&#160;&#160;claude-haiku-5-5&#160;&#160;&#160;&#160;&#160;&#160;14&#160;&#160;$0.0456&#160;&#160;</tspan><tspan fill="#67715c">░░░░░░░░░░</tspan><tspan fill="#f0f1e5">&#160;0.4%</tspan></text>
    <text x="22" y="503"><tspan fill="#c0c6af">&#160;&#160;The&#160;receipt&#160;as&#160;data:&#160;--receipt,&#160;or&#160;-o&#160;receipt.json.&#160;The&#160;document&#160;for</tspan></text>
    <text x="22" y="524"><tspan fill="#c0c6af">&#160;&#160;whoever&#160;pays:&#160;--pdf-out&#160;bill.pdf.</tspan></text>
  </g>
</svg>
