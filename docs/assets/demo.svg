<svg xmlns="http://www.w3.org/2000/svg" width="760" height="546" viewBox="0 0 760 546" role="img" aria-label="trazum optimize run: 238 tokens down to 142, minus 40.3 percent, saving 24 dollars a month — and an advisory worth 22 times the trim">
  <!--
    A transcript, not a mock-up. Every line below is real output from
    `trazum optimize` on a wordy support prompt at 50,000 calls a month —
    figures included, down to the closing line admitting an advisory is worth
    22× what the rules saved. If the report format changes, re-run and
    re-transcribe rather than editing numbers here: a demo with invented
    output is a claim the repository never made. (The first draft of this file
    contained exactly one invented advisory figure, and the comment you are
    reading is why it was caught.)

    The palette was GitHub's — #0d1117 on #161b22 with their greens and ambers
    — which put another product's identity on the one picture at the top of
    this repository's README. It wears Trazum's dark tokens now. **Colours
    only: not one glyph, figure or line of the transcript moved**, which is the
    only kind of edit this file admits without a re-run.
  -->
  <defs>
    <clipPath id="window"><rect x="10" y="8" width="740" height="530" rx="12"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="10" y="8" width="740" height="530" rx="12" fill="#171512" stroke="#363329" stroke-width="1"/>
  <g clip-path="url(#window)">
    <rect x="10" y="8" width="740" height="38" fill="#1e1c18"/>
    <line x1="10" y1="46" x2="750" y2="46" stroke="#363329" stroke-width="1"/>
  </g>
  <!--
    The window's mark, not macOS's three lights. The traffic lights are another
    product's chrome worn as a costume; this is the same ledger-shortening mark
    the app ships as its favicon, so the terminal in the README is recognisably
    Trazum's.
  -->
  <g transform="translate(26 15)">
    <rect width="24" height="24" rx="5.5" fill="#b0522f"/>
    <g stroke-width="2" stroke-linecap="round">
      <path d="M5.5 7h13.5" stroke="#fff"/>
      <path d="M5.5 12h9.5" stroke="#fff" opacity=".45"/>
      <path d="M5.5 12h6" stroke="#fff"/>
      <path d="M5.5 17h6" stroke="#fff" opacity=".45"/>
      <path d="M5.5 17h3.5" stroke="#fff"/>
    </g>
  </g>
  <text x="380" y="31" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#a8a495">trazum</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
    <text x="34" y="74" fill="#a8a495">$ <tspan fill="#efece4">trazum optimize support-prompt.txt --calls 50000 --cost</tspan></text>

    <text x="34" y="106" fill="#efece4" font-weight="bold">Input tokens</text>
    <text x="34" y="128" fill="#efece4">  238 → <tspan fill="#6fc99a" font-weight="bold">142</tspan>   <tspan fill="#6fc99a" font-weight="bold">-40.3%</tspan> <tspan fill="#a8a495">(estimated, ±6%)</tspan></text>

    <text x="34" y="160" fill="#efece4" font-weight="bold">Rules applied</text>
    <text x="34" y="182" fill="#a8a495">  [safe] <tspan fill="#efece4">Repeated paragraphs</tspan>          (1×, ~60 tokens)</text>
    <text x="34" y="204" fill="#a8a495">  [safe] <tspan fill="#efece4">Wordy phrasing</tspan>               (2×, ~7 tokens)</text>
    <text x="34" y="226" fill="#a8a495">  [safe] <tspan fill="#efece4">Politeness formulas</tspan>          (8×, ~20 tokens)</text>
    <text x="34" y="248" fill="#a8a495">  [safe] <tspan fill="#efece4">Filler and throat-clearing</tspan>   (1×, ~8 tokens)</text>

    <text x="34" y="280" fill="#efece4" font-weight="bold">Cost with Claude Opus 5</text>
    <text x="34" y="302" fill="#a8a495">  50,000 calls/month · 500 output tokens per call</text>
    <text x="34" y="324" fill="#efece4">  $684.50 → $660.50   <tspan fill="#6fc99a" font-weight="bold">saving $24.00/month</tspan> <tspan fill="#a8a495">(3.5%)</tspan></text>

    <text x="34" y="356" fill="#efece4" font-weight="bold">Beyond shortening the prompt</text>
    <text x="34" y="378" fill="#d6ad63">  → $528.40</text>
    <text x="130" y="378" fill="#efece4">This task may not need Claude Opus 5</text>
    <text x="130" y="398" fill="#a8a495">on Claude Haiku 4.5 you would go from $660.50 to $132.10 per month</text>
    <text x="34" y="426" fill="#d6ad63">  → $330.25</text>
    <text x="130" y="426" fill="#efece4">If the work tolerates latency, use the Batch API</text>
    <text x="34" y="454" fill="#a8a495">  ·</text>
    <text x="130" y="454" fill="#efece4">Your cost is in the output, not the prompt</text>
    <text x="130" y="474" fill="#a8a495">output accounts for $625.00 per month against $35.50 of input</text>

    <text x="34" y="510" fill="#efece4">  Start here: <tspan fill="#d6ad63">"This task may not need Claude Opus 5"</tspan> — $528.40/month, <tspan fill="#6fc99a" font-weight="bold">22×</tspan> what the rules saved.</text>
  </g>
</svg>
