<svg xmlns="http://www.w3.org/2000/svg" width="670" height="687" viewBox="0 0 670 687" role="img" aria-label="trazum optimize on a wordy support prompt: 326 tokens down to 202, $31.00 a month saved by the rules, and the lever the report says to start with">
  <!--
    Drawn by scripts/draw-demo.mjs from what the command in the window
    prints for examples/support-prompt.txt, in English. Do not edit: redraw.
    The suite fails when this stops being that output. The picture stops
    after the first lever and its last bar says how much of the report that
    is. (An XML comment cannot hold two hyphens in a row, which is why the
    command is not spelled out here.)
  -->
  <rect x="1" y="1" width="668" height="685" fill="#1c211b" stroke="#67715c" stroke-width="2"/>
  <rect x="2" y="2" width="666" height="40" fill="#242a21"/>
  <line x1="2" y1="42" x2="668" y2="42" stroke="#67715c" stroke-width="1"/>
  <g transform="translate(14 11) scale(0.55)"><path fill="#dce94d" stroke="#20231e" stroke-width="3" d="M1.5 1.5h37v37h-37z"/><path fill="#20231e" d="M9 10h22v6h-8v15h-6V16H9z"/></g>
  <text x="46" y="28" font-family="'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="-0.4" fill="#f0f1e5">Trazum</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="22" y="72"><tspan fill="#dce94d" font-weight="bold">$</tspan><tspan fill="#f0f1e5">&#160;trazum&#160;optimize&#160;examples/support-prompt.txt&#160;--calls&#160;50000&#160;--cost</tspan></text>
    <text x="22" y="104"><tspan fill="#f0f1e5" font-weight="bold">Start&#160;here:</tspan></text>
    <text x="22" y="125"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">"This&#160;task&#160;may&#160;not&#160;need&#160;Claude&#160;Opus&#160;5",&#160;$416.99/month,&#160;13×&#160;what&#160;the&#160;rules</tspan></text>
    <text x="22" y="146"><tspan fill="#c0c6af">&#160;&#160;saved.</tspan></text>
    <text x="22" y="188"><tspan fill="#f0f1e5" font-weight="bold">Input&#160;tokens</tspan></text>
    <text x="22" y="209"><tspan fill="#f0f1e5">&#160;&#160;326&#160;→&#160;</tspan><tspan fill="#6fc99a">202</tspan><tspan fill="#f0f1e5">&#160;&#160;&#160;</tspan><tspan fill="#f0f1e5" font-weight="bold">-38.0%</tspan><tspan fill="#c0c6af">&#160;(estimated,&#160;±6%)</tspan></text>
    <text x="22" y="251"><tspan fill="#f0f1e5" font-weight="bold">Rules&#160;applied</tspan></text>
    <text x="22" y="272"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">[safe]</tspan><tspan fill="#f0f1e5">&#160;Repeated&#160;paragraphs&#160;</tspan><tspan fill="#c0c6af">(1×,&#160;~72&#160;tokens)</tspan></text>
    <text x="22" y="293"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">[safe]</tspan><tspan fill="#f0f1e5">&#160;Wordy&#160;phrasing&#160;</tspan><tspan fill="#c0c6af">(2×,&#160;~6&#160;tokens)</tspan></text>
    <text x="22" y="314"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">[safe]</tspan><tspan fill="#f0f1e5">&#160;Politeness&#160;formulas&#160;</tspan><tspan fill="#c0c6af">(8×,&#160;~34&#160;tokens)</tspan></text>
    <text x="22" y="335"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#c0c6af">[safe]</tspan><tspan fill="#f0f1e5">&#160;Filler&#160;and&#160;throat-clearing&#160;</tspan><tspan fill="#c0c6af">(2×,&#160;~11&#160;tokens)</tspan></text>
    <text x="22" y="377"><tspan fill="#f0f1e5" font-weight="bold">Cost&#160;with&#160;Claude&#160;Opus&#160;5</tspan></text>
    <text x="22" y="398"><tspan fill="#f0f1e5">&#160;&#160;50,000&#160;calls/month&#160;·&#160;300&#160;output&#160;tokens&#160;per&#160;call</tspan></text>
    <text x="22" y="419"><tspan fill="#f0f1e5">&#160;&#160;$456.50&#160;→&#160;</tspan><tspan fill="#6fc99a">$425.50</tspan><tspan fill="#f0f1e5">&#160;&#160;&#160;</tspan><tspan fill="#f0f1e5" font-weight="bold">saving&#160;$31.00/month&#160;(6.8%)</tspan></text>
    <text x="22" y="461"><tspan fill="#f0f1e5" font-weight="bold">Beyond&#160;shortening&#160;the&#160;prompt</tspan></text>
    <text x="22" y="482"><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#dce94d">→</tspan><tspan fill="#f0f1e5">&#160;</tspan><tspan fill="#6fc99a">$416.99</tspan><tspan fill="#f0f1e5">&#160;&#160;</tspan><tspan fill="#f0f1e5" font-weight="bold">This&#160;task&#160;may&#160;not&#160;need&#160;Claude&#160;Opus&#160;5</tspan></text>
    <text x="22" y="503"><tspan fill="#f0f1e5">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c0c6af">By&#160;length&#160;and&#160;vocabulary&#160;the&#160;prompt&#160;looks&#160;like&#160;"haiku"</tspan></text>
    <text x="22" y="524"><tspan fill="#c0c6af">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;complexity.&#160;On&#160;Claude&#160;Haiku&#160;5.5&#160;you&#160;would&#160;go&#160;from&#160;$425.50&#160;to</tspan></text>
    <text x="22" y="545"><tspan fill="#c0c6af">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;$8.51&#160;per&#160;month.&#160;This&#160;is&#160;a&#160;keyword&#160;heuristic,&#160;not&#160;a&#160;judgement</tspan></text>
    <text x="22" y="566"><tspan fill="#c0c6af">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;about&#160;answer&#160;quality.&#160;Measure&#160;it&#160;before&#160;switching&#160;in&#160;production:</tspan></text>
    <text x="22" y="587"><tspan fill="#c0c6af">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;`trazum&#160;route&#160;&lt;log.jsonl&gt;&#160;--prompt-file&#160;&lt;prompt&gt;&#160;--cases&#160;&lt;cases&gt;</tspan></text>
    <text x="22" y="608"><tspan fill="#c0c6af">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;--yes`&#160;sends&#160;the&#160;same&#160;cases&#160;to&#160;both&#160;models&#160;and&#160;reports&#160;whether</tspan></text>
    <text x="22" y="629"><tspan fill="#c0c6af">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;cheaper&#160;one&#160;still&#160;does&#160;the&#160;job.</tspan></text>
  </g>
  <rect x="2" y="651" width="666" height="34" fill="#242a21"/>
  <line x1="2" y1="651" x2="668" y2="651" stroke="#67715c" stroke-width="1"/>
  <text x="22" y="673" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#c0c6af">The&#160;first&#160;26&#160;of&#160;the&#160;51&#160;lines&#160;this&#160;prints.&#160;The&#160;other&#160;levers&#160;follow.</text>
</svg>
