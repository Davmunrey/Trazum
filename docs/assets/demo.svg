<svg xmlns="http://www.w3.org/2000/svg" width="760" height="546" viewBox="0 0 760 546" role="img" aria-label="trazum optimize run: 238 tokens down to 142, minus 40.3 percent, saving 24 dollars a month — and an advisory worth 22 times the trim">
  <!--
    A transcript, not a mock-up. Every line below is real output from
    `trazum optimize` on a wordy support prompt at 50,000 calls a month —
    figures included, down to the closing line admitting an advisory is worth
    22× what the rules saved. If the report format changes, re-run and
    re-transcribe rather than editing numbers here: a demo with invented
    output is a claim the repository never made. (The first draft of this file
    contained exactly one invented advisory figure, and the comment you are
    reading is why it was caught.)
  -->
  <defs>
    <clipPath id="window"><rect x="10" y="8" width="740" height="530" rx="12"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="10" y="8" width="740" height="530" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <g clip-path="url(#window)">
    <rect x="10" y="8" width="740" height="38" fill="#161b22"/>
    <line x1="10" y1="46" x2="750" y2="46" stroke="#30363d" stroke-width="1"/>
  </g>
  <circle cx="34" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="27" r="6" fill="#27c93f"/>
  <text x="380" y="31" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e">trazum</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
    <text x="34" y="74" fill="#8b949e">$ <tspan fill="#e6edf3">trazum optimize support-prompt.txt --calls 50000 --cost</tspan></text>

    <text x="34" y="106" fill="#e6edf3" font-weight="bold">Input tokens</text>
    <text x="34" y="128" fill="#e6edf3">  238 → <tspan fill="#7ee787" font-weight="bold">142</tspan>   <tspan fill="#7ee787" font-weight="bold">-40.3%</tspan> <tspan fill="#8b949e">(estimated, ±15%)</tspan></text>

    <text x="34" y="160" fill="#e6edf3" font-weight="bold">Rules applied</text>
    <text x="34" y="182" fill="#8b949e">  [safe] <tspan fill="#e6edf3">Repeated paragraphs</tspan>          (1×, ~60 tokens)</text>
    <text x="34" y="204" fill="#8b949e">  [safe] <tspan fill="#e6edf3">Wordy phrasing</tspan>               (2×, ~7 tokens)</text>
    <text x="34" y="226" fill="#8b949e">  [safe] <tspan fill="#e6edf3">Politeness formulas</tspan>          (8×, ~20 tokens)</text>
    <text x="34" y="248" fill="#8b949e">  [safe] <tspan fill="#e6edf3">Filler and throat-clearing</tspan>   (1×, ~8 tokens)</text>

    <text x="34" y="280" fill="#e6edf3" font-weight="bold">Cost with Claude Opus 5</text>
    <text x="34" y="302" fill="#8b949e">  50,000 calls/month · 500 output tokens per call</text>
    <text x="34" y="324" fill="#e6edf3">  $684.50 → $660.50   <tspan fill="#7ee787" font-weight="bold">saving $24.00/month</tspan> <tspan fill="#8b949e">(3.5%)</tspan></text>

    <text x="34" y="356" fill="#e6edf3" font-weight="bold">Beyond shortening the prompt</text>
    <text x="34" y="378" fill="#d29922">  → $528.40</text>
    <text x="130" y="378" fill="#e6edf3">This task may not need Claude Opus 5</text>
    <text x="130" y="398" fill="#8b949e">on Claude Haiku 4.5 you would go from $660.50 to $132.10 per month</text>
    <text x="34" y="426" fill="#d29922">  → $330.25</text>
    <text x="130" y="426" fill="#e6edf3">If the work tolerates latency, use the Batch API</text>
    <text x="34" y="454" fill="#8b949e">  ·</text>
    <text x="130" y="454" fill="#e6edf3">Your cost is in the output, not the prompt</text>
    <text x="130" y="474" fill="#8b949e">output accounts for $625.00 per month against $35.50 of input</text>

    <text x="34" y="510" fill="#e6edf3">  Start here: <tspan fill="#d29922">"This task may not need Claude Opus 5"</tspan> — $528.40/month, <tspan fill="#7ee787" font-weight="bold">22×</tspan> what the rules saved.</text>
  </g>
</svg>
