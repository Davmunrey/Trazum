# A reverse proxy in front of the web app's container (GHSA-xx4w-86jg-r8xr).
#
# The container must not face the internet on its own. Run as it ships, one
# client could exhaust its memory three ways: bodies Next buffers before any
# check, a rate limiter keyed by whatever X-Forwarded-For said, and requests
# that never finish. Against the container limited to 512 MB, a proxy with
# these three settings stopped all three from a single address:
#
#   - client_max_body_size 4m      the largest body a route accepts is 2.4 MB
#   - X-Forwarded-For overwritten  with the address of the connection, so the
#                                  per-address limits count real addresses
#   - limit_conn 10 per address    a body limit alone did not hold: 600 bodies
#                                  of 3.9 MB at once still killed the container
#
# What it does not cover: a client with many addresses. That needs more memory
# or a filter at the edge.
#
# Put the `limit_conn_zone` line in the `http` block, this `server` block in
# your sites, and replace the certificate paths and server_name.

limit_conn_zone $binary_remote_addr zone=trazum_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name trazum.example;

    ssl_certificate     /etc/ssl/certs/trazum.pem;
    ssl_certificate_key /etc/ssl/private/trazum.key;

    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn trazum_conn 10;
    limit_conn_status 503;

    location / {
        # The whole body arrives here before the app sees a byte of it, so a
        # body that trickles in costs the proxy, not the app.
        proxy_request_buffering on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: the app reads the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }
}
